<style>

*{box-sizing:border-box;margin:0;padding:0;font-family:var(--ff)}
html,body{width:100%;overflow-x:hidden;background:var(--bg);color:var(--tx);padding-bottom:40px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}

.ocard b{font-size:1rem;font-weight:800}

.selrow{margin-bottom:8px}.selrow b{flex:1;font-size:.9rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.selrow .inp.sq{width:90px}
.rl .nb{padding:5px 10px}

.chg{color:var(--mu);font-size:.82rem;font-weight:600;padding:2px 4px 12px;line-height:1.5}

.bkrow{display:flex;gap:6px;margin-bottom:8px}
textarea.inp{font-size:.8rem;margin-top:6px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--ac);padding:9px 16px;border-radius:9px;font-size:.84rem;font-weight:600;z-index:200;display:none}

<header>
  <div class="hb">
    <h1>📋 SİPARİŞ YÖNLENDİRME</h1>

<script>
/* ============================================================
   KALE DOKUMA - SIPARIS YONLENDIRME SAYFASI (siparis.html)  -- BELGE / DOCUMENTATION
   Ayrintili belge icin README.md dosyasina bakin.

   NE YAPAR: Musteri siparisi alir (musteri > urun/olcu > renk(ler) > sonuc) ve
   siparisin hangi tezgahlara verilebilecegini onerir (suggest). Siparis satirlari
   tezgaha atanabilir (pin), yapilan adet takip edilir.

   VERI: YAZAR kale_siparis_v1/orders. OKUR kale_dokuma_live_v2 (tezgahlar) ve
   kale_customers_pool_v2 (musteriler) - bu ikisini ASLA yazmaz.

   TEMEL KURALLAR:
   - P[] urun tablosu ve FULL140 / ONLY100 asagida duzenlenir.
   - FULL140: 140 cm tezgahlardan sadece bunlar tam 140 cm genislikte uretir
     (Karaman 1 = "K1"). Diger 140 cm tezgahlar 70 cm'lik iki kanatla calisir.
   - ONLY100: 200 cm tezgahlardan sadece 100 cm genislikte halı yapan TEK tezgah.
     = ["A3"] (Acar 3). 100 cm halilarda (100x200/300/400) 1 parca. Jakar ayari yuzunden 200 cm genislikte hali (200x300, 200x400), cemaat seccadesi 110x200 ve 60x80 URETMEZ; ama 200 cm genislikte KUMAS (rulo) uretir.
   - Eslesme sadece ANA renk + genislige gore yapilir (alt renk/cozgu gorsel).
   - 140 cm kanat kurali: renk sadece bir kanatta varsa diger kanat da kendi rengini
     uretir; musteri o rengi de almak zorundadir. suggest() puani: 2 = iki kanat da
     ayni renk, 1.5 = diger kanat rengi ayni siparisin baska satirinda var,
     1 = diger kanat uyumsuz (uyari + zorunlu miktar), 0 = uyumsuz.
   - ESLIK SATIR (comp:{of, m}): satir 140 cm kanatli tezgaha atanirsa ve diger kanatta
     baska bir renk varsa, ayni musteri/ayni adet icin otomatik satir olusur. Asil
     satir silinir/atama kalkarsa silinir; adet degisirse eslik de degisir.
     "Yapilan" (done) ikisinde BAGIMSIZ tutulur (nihai karar bekliyor).
   - Metraj: duz urunlerde satir sayisi x parca boyu; rulolarda rulo sayisi x rulo metresi
     (140=40m, 160=35m, 200=30m; kumas rulo ADEDI ile siparis edilir, metre ile degil).
     Halilar once kumas gibi ardisik uretilir, sonra elle kesilir (metre buna gore).
   - Cemaat seccadesi 110x200: SADECE 200 cm tezgahlarda; parca boyu 110 cm (1,1 m/parca).
   - 60x80 (Kadife hali grubu): 200 cm tezgahta 3 sutun 60+80+60; ortadaki parca dondurulmus.
     480 cm'lik devirde 6+8+6 = 20 parca (cyc:4.8 m, ac:20) -> parca basina 0,24 m.
     Kesirli devir yukari yuvarlanir; hesap yaklasiktir.
   - 140 cm tezgahlar (kumas da dahil): iki kanat TEK 140 cm'lik kumas uretir, ortadan
     kesilir. Kanatlar farkli renkteyse iki renk de cikar; musteri ikisini de kabul eder
     ya da siparis reddedilir (esdeger satir mantigi bunu gosterir).

   GIRIS: Firebase Authentication (e-posta/sifre). Giris yapilmadan veri dinlenmez.
   ============================================================ */
/* ============ AYARLAR (gerektiğinde burayı düzenleyin) ============ */
const FULL140 = ["K1"];   // 140 cm TAM genişlikte halı/seccade yapabilen makineler
const ONLY100 = ["A3"];  // 200'lük makineler içinde SADECE 100 cm halı yapan tek makine: Acar 3

/* Cemaat seccadesi 110×200: sadece 200 cm tezgahlarda, 200 cm tezgah eninde, parça boyu 110 cm (w=200, l=110).
   60×80: 200 cm tezgahta 3 sütun (60 + 80 + 60); yan sütunlarda parça 60 en x 80 boy, ortada döndürülmüş (80 en x 60 boy).
   480 cm'lik bir DEVİRDE 6 + 8 + 6 = 20 parça çıkar -> ac:20 parça/devir, cyc:4.8 m/devir (parça başı 0,24 m).
   Ürünler: w=en, l=boy (cm). opts: hangi makine eninde, yan yana kaç parça (ac) üretilir.
   need:"full140" -> sadece FULL140 makineleri | no100:true -> ONLY100 makineleri hariç | ac100 -> ONLY100 makinesinde parça sayısı */
const P = [
  { k:"s70", g:"Seccade", name:"70 × 110", w:70, l:110, opts:[{ mw:140, ac:2 }] },
  { k:"s80", g:"Seccade", name:"80 × 120", w:80, l:120, opts:[{ mw:160, ac:2 }] },
  { k:"c110", g:"Cemaat seccadesi", name:"110 × 200", w:200, l:110, opts:[{ mw:200, ac:1, no100:true }] },
  { k:"h60x80", g:"Kadife halı", name:"60 × 80", w:60, l:80, opts:[{ mw:200, ac:20, cyc:4.8, note:"6+8+6", no100:true }] },
  { k:"h100", g:"Kadife halı", name:"100 × 200", w:100, l:200, opts:[{ mw:200, ac:2, ac100:1 }] },
  { k:"h100x300", g:"Kadife halı", name:"100 × 300", w:100, l:300, opts:[{ mw:200, ac:2, ac100:1 }] },
  { k:"h100x400", g:"Kadife halı", name:"100 × 400", w:100, l:400, opts:[{ mw:200, ac:2, ac100:1 }] },
  { k:"h140", g:"Kadife halı", name:"140 × 200", w:140, l:200, opts:[{ mw:140, ac:1, need:"full140" }] },
  { k:"h160", g:"Kadife halı", name:"160 × 250", w:160, l:250, opts:[{ mw:160, ac:1 }] },
  { k:"h200x300", g:"Kadife halı", name:"200 × 300", w:200, l:300, opts:[{ mw:200, ac:1, no100:true }] },
  { k:"h200x400", g:"Kadife halı", name:"200 × 400", w:200, l:400, opts:[{ mw:200, ac:1, no100:true }] },
  { k:"rulo", g:"Kumaş", name:"Rulo", roll:true, opts:[{ mw:140, len:40 }, { mw:160, len:35 }, { mw:200, len:30 }] }
];
/* ================================================================== */

const COLORS = {
  "PETROL":"#0ea5e9","KOYU BORDO":"#4a0404","LACİVERT":"#1e3a8a","AÇIK BORDO":"#9f1239",
  "AÇIK GRİ":"#d1d5db","PAST GRAY":"#f1f5f9","SP GREY":"#94a3b8","KOYU GRİ":"#334155","SİYAH":"#0f172a",
  "SİLKY(SARIBEJ)":"#f59e0b","SARIBEJ":"#d4a373","ŞEKER LT":"#fef9c3","IVORY":"#fffff0","ŞEKER AYM":"#fef3c7",
  "VİZON":"#b08968","KOYU KAHVE":"#38220f","MARON":"#722f37","ZÜMRÜT":"#0e4d64","Z-blue":"#0284c7",
  "FOWN (AÇIK BAL)":"#e6ccb2","NEFTİ":"#14532d","FISTIK YEŞİL":"#84cc16"
};
const hexOf = n => COLORS[n] || "#475569";
const WARPS = { "SİYAH":"#0f172a", "BEYAZ":"#ffffff", "SARI":"#eab308" };
const WARP_DEF = ["BEYAZ", "SİYAH"];
const BRANCHES = { R:{ name:"Rüya", count:16 }, A:{ name:"Acar", count:4 }, Y:{ name:"Y. Acar", count:8 }, K:{ name:"Karaman", count:6 } };
const WIDTHS = [140, 160, 200];
const STATUS = { running:["Çalışıyor","var(--run)"], stopped:["Durduruldu","var(--stop)"], yarn:["İplik yok","var(--yarn)"], maint:["Arıza/Bakım","var(--mnt)"] };
const OKEY = "kale_siparis_local_v1";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const $ = id => document.getElementById(id);
const lc = s => s.toLocaleLowerCase("tr");
const uid = () => Math.random().toString(36).slice(2, 9);
const ids = Object.entries(BRANCHES).flatMap(([b, o]) => Array.from({ length:o.count }, (_, i) => b + (i + 1)));

function norm(l, id) {
  const n = parseInt(id.slice(1), 10);
  const m = { id, branch:id[0], num:n, width:WIDTHS[(n - 1) % 3], status:"running", currentCustomer:"", nextCustomer:"", ...l };
  m.width = Number(m.width) || WIDTHS[(n - 1) % 3];
  const c = Array.isArray(m.colors) ? m.colors.map(x => x?.name ?? x) : [];
  m.colors = Array.from({ length: m.width === 140 ? 6 : 4 }, (_, i) => (c[i] in COLORS ? c[i] : "0"));
  const w = Array.isArray(m.warps) ? m.warps.map(x => x?.name ?? x) : [];
  m.warps = [0, 1].map(i => (w[i] in WARPS ? w[i] : WARP_DEF[i]));
  return m;
}
let looms = {}, customers = [], orders = [], ordRef = null, firstOrd = true;
try {
  const c = JSON.parse(localStorage.getItem("kale_dokuma_local_v3") || "null");
  ids.forEach(id => looms[id] = norm(c?.[id], id));
  customers = JSON.parse(localStorage.getItem("kale_customers_list_v3") || "[]");
} catch { ids.forEach(id => looms[id] = norm(null, id)); }
try { orders = JSON.parse(localStorage.getItem(OKEY) || "[]"); } catch { orders = []; }
const cache = () => { try { localStorage.setItem(OKEY, JSON.stringify(orders)); } catch {} };
const wingSig = m => (m.width === 140 ? [m.colors[0], m.colors[3]] : [m.colors[0]]).join("|");
/* Satırın bu makinede tahmini tezgah metresi (kalan adet üzerinden) */
function lineM(ln, m) {
  const e = (ln.mt || {})[m?.id]; if (!e) return null;
  const R = rem(ln); let [ac, len] = e;
  if (!ac) return Math.round(R * len * 10) / 10;
  const hit = (m.width === 140 ? [m.colors[0], m.colors[3]] : [m.colors[0]]).filter(c => c === ln.color).length;
  if (m.width === 140 && ac === 2 && hit === 1) ac = 1;
  return Math.round(Math.ceil(R / ac) * len * 10) / 10;
}
function eligible(p, l) {
  return p.opts.find(o => o.mw === l.width
    && (o.need !== "full140" || FULL140.includes(l.id))
    && !(o.no100 && ONLY100.includes(l.id)));
}
/* Her satıra: ürün adı, boyut olarak uygun makineler (ok), tam-en bilgisi (full). Ana sayfa bunları okur. */
function prep(o) {
  o.lines.forEach(l => {
    const p = prodOf(l.k); if (!p) return;
    l.pn = pname(p);
    l.mt = {};  /* makine -> [yan yana parça (devirli üründe devir başına parça), parça başına metre (devirli üründe devir metresi)]; rulo için [0, rulo metresi] */
    Object.values(looms).forEach(m => {
      const o = eligible(p, m); if (!o) return;
      l.mt[m.id] = p.roll ? [0, o.len] : [(ONLY100.includes(m.id) && o.ac100) ? o.ac100 : o.ac, o.cyc || p.l / 100];
    });
    l.ok = Object.keys(l.mt);
    l.full = !p.roll && p.opts.some(x => x.mw === 140 && x.ac === 1);
    l.asg = l.asg || {};
  });
}
function pushOrder(o) {
  prep(o); cache();
  if (ordRef) ordRef.child(o.id).set(JSON.parse(JSON.stringify(o))).catch(() => toast("Firebase'e yazılamadı (yerelde saklandı)"));
}
const arr = x => Array.isArray(x) ? x : Object.values(x || {});
const normOrder = x => ({ ...x, saved: true, lines: arr(x.lines).map(l => ({ ...l, ok: arr(l.ok), asg: l.asg || {} })) });

function allCust() {
  const m = new Map();
  [...customers, ...orders.map(o => o.cust), ...Object.values(looms).flatMap(l => [l.currentCustomer, l.nextCustomer])].forEach(n => {
    n = (n || "").trim();
    if (n && n !== "-" && !m.has(lc(n))) m.set(lc(n), n);
  });
  return [...m.values()].sort((a, b) => a.localeCompare(b, "tr"));
}

let S = { view:"home", order:null, cin:"", pk:null, sel:{}, all:{}, bk:null };
const prodOf = k => P.find(p => p.k === k);
const rem = l => Math.max(0, (l.qty || 0) - (l.done || 0));
const pname = p => p.roll ? "Rulo kumaş" : `${p.g} ${p.name}`;
const persist = () => { if (S.order?.saved) pushOrder(S.order); };

/* ---------- Öneri motoru ---------- */
function suggest(line, order) {
  const p = prodOf(line.k), R = rem(line), res = [];
  Object.values(looms).forEach(l => {
    const o = eligible(p, l);
    if (!o) return;
    const only100 = ONLY100.includes(l.id), two = l.width === 140;
    const wings = two ? [l.colors[0], l.colors[3]] : [l.colors[0]];
    const ac = p.roll ? 0 : ((only100 && o.ac100) ? o.ac100 : o.ac);
    const r = { l, wings, only100, ac, busy: !!(l.currentCustomer || "").trim(), maint: l.status === "maint", notes: [], waste: 0, pref: 0 };
    const hit = wings.filter(c => c === line.color).length;
    const half = p.roll ? R : Math.ceil(R / ac);
    let rows = half;
    if (!two) r.match = hit ? 2 : 0;
    else if (!p.roll && ac === 1) {
      /* 140 tam en: iki kanat tek parça çalışır, ikisi de aynı renk olmalı */
      r.match = hit === 2 ? 2 : 0; rows = R;
      if (hit === 1) r.notes.push(["bad", "Kanat renkleri farklı; tam en için ikisi de aynı olmalı"]);
    } else if (hit === 2) r.match = 2;
    else if (hit === 1) {
      /* İki kanat birlikte çalışır: diğer kanadın rengi de üretilir, müşteri onu da almak zorunda */
      const other = wings.find(c => c !== line.color);
      const partner = order.lines.find(x => x !== line && !x.comp && x.k === line.k && x.color === other && rem(x) > 0);
      rows = R;
      if (partner) { r.match = 1.5; r.notes.push(["ok", `✓ Diğer kanat (${other}) siparişteki başka satırı da karşılıyor (${rem(partner)} adet)`]); }
      else { r.match = 1; r.notes.push(["warn", `⚠ Diğer kanat ${other}: müşteri bu rengi de almak zorunda${p.roll ? "" : ` (${R} adet fazladan ${other})`}`]); }
    } else r.match = 0;
    if (p.roll) { r.len = o.len; r.rows = rows; r.total = rows * o.len; r.pref = WIDTHS.indexOf(l.width); }
    else { r.rows = rows; r.meters = Math.round(rows * (o.cyc ? o.cyc * 100 : p.l)) / 100; r.waste = o.cyc ? 0 : Math.max(0, Math.round((1 - ac * p.w / l.width) * 100)); r.cyc = !!o.cyc; r.note = o.note || ""; }
    res.push(r);
  });
  const key = r => (2 - r.match) * 1e6 + (r.maint ? 5e5 : 0) + (r.busy ? 1e5 : 0) + r.waste * 1e3 + r.pref * 100 + r.l.num;
  return res.sort((a, b) => key(a) - key(b));
}

/* ---------- Görünümler ---------- */
/* Sadece GÖSTERİM: alt renkler ve çözgü (eşleştirmeye / sıralamaya girmez) */
function extraHtml(l) {
  const c = l.colors, one = n => n === "0" ? "" : `<span class="sc"><i class="dot s" style="background:${hexOf(n)}"></i>${esc(n)}</span>`;
  const grp = (lab, a) => { const h = a.map(one).join(""); return h ? `<span class="sg">${lab}${h}</span>` : ""; };
  const subs = l.width === 140 ? grp("K1:", [c[1], c[2]]) + grp("K2:", [c[4], c[5]]) : grp("", [c[1], c[2], c[3]]);
  const wp = l.warps.map((w, i) => `<span class="sc">${i + 1}:<i class="dot s" style="background:${WARPS[w]}"></i>${esc(w)}</span>`).join("");
  return `<div class="rl xt"><span class="xl">Alt:</span>${subs || "—"}</div><div class="rl xt"><span class="xl">Çözgü:</span>${wp}</div>`;
}
function resHtml(r, i, p, line) {
  const l = r.l, [stl, stc] = STATUS[l.status] || STATUS.running;
  const isA = (line.asg || {})[l.id] !== undefined;
  const asgHtml = (isA ? `<span class="ok">📌 Atandı</span>${line.asg[l.id] !== wingSig(l) ? '<span class="warn">⚠ Atandığından beri renk değişti</span>' : ""}` : "")
    + `<button class="nb" data-act="asg" data-line="${line.id}" data-m="${l.id}">${isA ? "✕ Atamayı kaldır" : "📌 Bu makineye ata"}</button>`;
  const dots = r.wings.map(c => `<span class="dot s" style="background:${hexOf(c)}"></span>`).join("");
  const names = r.wings.map(c => c === "0" ? "boş" : esc(c)).join(" + ");
  const colorLine = r.match === 2 ? `<span class="ok">✓ Renk zaten takılı</span>`
    : r.match > 0 ? `<span class="mid">◐ Renk bir kanatta takılı</span>`
    : `<span class="bad">Renk değişimi gerekir</span>`;
  const cur = (l.currentCustomer || "").trim(), nxt = (l.nextCustomer || "").trim();
  const busy = cur ? `<span class="mid">Şu an: <b>${esc(cur)}</b>${nxt ? ` → Sıradaki: <b>${esc(nxt)}</b>` : ""}</span>` : `<span class="ok">Boşta (müşteri yok)</span>`;
  const prod = p.roll ? `${r.rows} rulo × ${r.len} m = <b>${r.total} m</b>`
    : r.cyc ? `${r.ac} parça / devir (${esc(r.note)}) · ${r.rows} devir · <b>${r.meters} m</b> tezgah boyu`
    : `${r.ac} parça yan yana · ${r.rows} sıra · <b>${r.meters} m</b> tezgah boyu${r.waste ? ` · %${r.waste} boşluk` : ""}`;
  return `<div class="res${i === 0 && r.match > 0 ? " best" : ""}">
    <div class="rh"><b>${esc(l.id)}</b><span class="br">${esc(BRANCHES[l.branch].name)}</span>
      <span class="w w${l.width}">${l.width} cm</span><span class="st" style="background:${stc}"></span><span class="stl">${stl}</span>
      ${i === 0 && r.match > 0 ? '<span class="tag">★ En uygun</span>' : ""}</div>
    <div class="rl">${dots}<span>${names}</span> · ${colorLine}</div>
    ${extraHtml(l)}
    <div class="rl">${busy}</div>
    <div class="rl">${prod}</div>
    ${r.notes.map(([c, t]) => `<div class="rl ${c}">${esc(t)}</div>`).join("")}
    <div class="rl">${asgHtml}</div>
    ${r.only100 ? '<div class="rl warn">⚠ Sadece 100 cm halı, belirli desenler</div>' : ""}
    ${r.maint ? '<div class="rl warn">⚠ Arıza/Bakımda</div>' : ""}
  </div>`;
}
function ocard(o) {
  const tot = o.lines.reduce((s, l) => s + rem(l), 0);
  return `<button class="ocard" data-act="open" data-id="${o.id}"><b>${esc(o.cust)}</b>
    <small>${new Date(o.created).toLocaleDateString("tr-TR")} · ${o.lines.length} satır · ${tot ? `kalan ${tot} adet` : "✓ tamamlandı"}</small></button>`;
}
function lineHtml(l) {
  const p = prodOf(l.k), r = rem(l);
  const am = Object.keys(l.asg || {}), chg = am.filter(m => looms[m] && l.asg[m] !== wingSig(looms[m]));
  const asgLine = am.length ? `<div class="lq"><span>📌 ${am.map(m => { const t = l.comp ? null : lineM(l, looms[m]); return esc(m) + (t != null ? ` (≈${t} m)` : ""); }).join(", ")}</span>${chg.length ? `<span class="warn">⚠ renk değişti: ${chg.map(esc).join(", ")}</span>` : ""}</div>` : "";
  return `<div class="line${r ? "" : " dn"}"><div class="lh"><span class="dot" style="background:${hexOf(l.color)}"></span>
    <b>${esc(p ? pname(p) : l.k)} · ${esc(l.color)}</b>${l.comp ? "" : `<button data-act="del-line" data-id="${l.id}" aria-label="Sil">✕</button>`}</div>${l.comp ? `<div class="lq"><span class="ok">↳ Eşlik eden satır (${esc(l.comp.m)} makinesinin diğer kanadı)</span></div>` : ""}
    <div class="lq"><span>Sipariş: ${l.comp ? `<b>${l.qty}</b>` : `<input class="q-in" type="number" inputmode="numeric" min="1" value="${l.qty}" data-id="${l.id}">`}</span>
    <label>Yapılan <input class="dn-in" type="number" inputmode="numeric" min="0" max="${l.qty}" value="${l.done || 0}" data-id="${l.id}"></label>
    <span>${r ? `Kalan: <b>${r}</b>` : "✓ Bitti"}</span></div>${asgLine}</div>`;
}

function render(keep) {
  const o = S.order, V = S.view, app = $("app");
  $("crumbs").innerHTML = o ? `<span>👤 ${esc(o.cust)}</span>` + (V === "color" && S.pk ? `<span>📐 ${esc(pname(prodOf(S.pk)))}</span>` : "") : "";

  if (V === "home") {
    const list = [...orders].sort((a, b) => b.created - a.created);
    app.innerHTML = `<button class="primary" data-act="new" style="margin:0 0 16px">➕ Yeni sipariş</button>
      <h2>Kayıtlı siparişler (${list.length})</h2>` +
      (list.length ? list.map(ocard).join("") : '<div class="empty">Henüz kayıtlı sipariş yok.</div>') +
      `<h3>Yedek</h3>
      <div class="bkrow"><button class="nb" data-act="bk-out">📤 Yedek al</button><button class="nb" data-act="bk-in">📥 Geri yükle</button></div>` +
      (S.bk ? `<textarea id="bk" class="inp" rows="5" ${S.bk === "out" ? "readonly" : 'placeholder="Yedek metnini buraya yapıştırın"'}>${S.bk === "out" ? esc(JSON.stringify(orders)) : ""}</textarea>` +
        (S.bk === "in" ? '<button class="second" data-act="bk-apply">Uygula</button>' : "") : "");
  } else if (V === "cust") {
    app.innerHTML = `<h2>Müşteri</h2>
      <input id="cin" class="inp" placeholder="Müşteri adını yazın..." value="${esc(S.cin)}" autocomplete="off">
      <div class="chips" id="chips"></div>
      <button class="primary" data-act="cust-ok">Tamam</button>`;
    $("cin").oninput = e => { S.cin = e.target.value; drawChips(); };
    drawChips();
  } else if (V === "prod") {
    let h = "<h2>Ürün / Ebat</h2>", g = "";
    P.forEach(p => {
      if (p.g !== g) { if (g) h += "</div>"; g = p.g; h += `<h3>${esc(g)}</h3><div class="pgrid">`; }
      h += `<button class="pcard" data-act="prod" data-k="${p.k}"><b>${esc(p.name)}</b><small>Makine: ${p.opts.map(o => o.mw).join(" / ")} cm</small></button>`;
    });
    app.innerHTML = h + "</div>";
  } else if (V === "color") {
    const roll = prodOf(S.pk).roll;
    const av = availColors(S.pk), avSet = new Set(av.map(a => a.c));
    const btn = n => `<button class="cbtn${S.sel[n] ? " sel" : ""}" data-act="color" data-v="${esc(n)}"><span class="dot" style="background:${hexOf(n)}"></span><span>${esc(n)}</span></button>`;
    app.innerHTML = `<h2>Renkler (birden fazla seçebilirsiniz)</h2>
      <h3>Şu an makinelerde takılı renkler (${av.length})</h3>
      ${av.length ? `<div class="avl-list">${av.map(a => `<button class="cbtn avl${S.sel[a.c] ? " sel" : ""}" data-act="color" data-v="${esc(a.c)}"><span class="dot" style="background:${hexOf(a.c)}"></span><span class="an"><b>${esc(a.c)}</b><span>${a.rs.map(chipHtml).join("")}</span></span></button>`).join("")}</div>`
        : '<div class="hint">Bu ürün için uygun makinelerde şu an takılı renk yok.</div>'}
      <h3>Diğer renkler (makinede takılı değil)</h3>
      <div class="cgrid">${Object.keys(COLORS).filter(n => !avSet.has(n)).map(btn).join("")}</div>
      <h3>${roll ? "Seçilen renkler ve rulo adedi" : "Seçilen renkler ve adetler"}</h3>
      <div id="selbox"></div>
      ${roll ? '<p class="hint">Rulo boyu: 140\'lıkta 40 m · 160\'lıkta 35 m · 200\'lükte 30 m</p>' : ""}
      <button class="primary" data-act="addline">Satırları ekle</button>`;
    drawSel();
  } else if (V === "order") {
    app.innerHTML = `<h2>Sipariş: ${esc(o.cust)}</h2>` +
      (o.lines.length ? o.lines.map(lineHtml).join("") : '<div class="empty">Henüz ürün eklenmedi.</div>') +
      `<button class="second" data-act="addmore">➕ Ürün / renk ekle</button>` +
      (o.lines.length ? '<button class="primary" data-act="show">🔍 Makineleri göster</button>' : "") +
      (o.saved ? "" : (o.lines.length ? '<button class="second" data-act="save">💾 Siparişi kaydet</button>' : "")) +
      (o.saved ? '<button class="second" data-act="delord" style="color:var(--stop)">🗑 Siparişi sil</button>' : "");
  } else {
    const open = o.lines.filter(l => rem(l) > 0 && prodOf(l.k) && !l.comp);
    let h = `<h2>Uygun makineler</h2>`;
    if (!open.length) h += '<div class="empty">Bu siparişin tamamı bitmiş 🎉</div>';
    open.forEach(l => {
      const p = prodOf(l.k), list = suggest(l, o), asgIds = Object.keys(l.asg || {});
      const shown = S.all[l.id] ? list : list.filter(r => r.match > 0 || asgIds.includes(r.l.id));
      const change = list.filter(r => !shown.includes(r));
      h += `<div class="sec"><span class="dot" style="background:${hexOf(l.color)}"></span>${esc(pname(p))} · ${esc(l.color)} — kalan ${rem(l)}</div>`;
      if (!list.length) h += '<div class="empty">Uygun makine yok. FULL140 / ONLY100 ayarlarını kontrol edin.</div>';
      else {
        h += shown.length ? shown.map((r, i) => resHtml(r, i, p, l)).join("") : '<div class="empty">Bu renk şu an hiçbir uygun makinede takılı değil.</div>';
        if (change.length) h += `<div class="chg">Renk değişimi şartıyla: ${change.map(r => esc(r.l.id)).join(", ")}</div>`;
        if (change.length) h += `<button class="second" data-act="more" data-id="${l.id}">Hepsini kartlarla göster (${list.length})</button>`;
      }
    });
    app.innerHTML = h;
  }
  if (!keep) window.scrollTo(0, 0);
}

/* Seçilen ürün için, şu an uygun makinelerde takılı olan renkler ve makineleri */
function availColors(k) {
  const res = [];
  Object.keys(COLORS).forEach(c => {
    const rs = suggest({ id: "_", k, color: c, qty: 1, done: 0, asg: {} }, { lines: [] }).filter(r => r.match > 0);
    if (rs.length) res.push({ c, rs });
  });
  return res.sort((a, b) => b.rs.filter(r => !r.busy).length - a.rs.filter(r => !r.busy).length || b.rs.length - a.rs.length);
}
function chipHtml(r) {
  const cur = (r.l.currentCustomer || "").trim();
  return `<span class="mch${r.busy ? "" : " free"}">${esc(r.l.id)}${r.maint ? " ⚠" : ""}${r.match < 2 ? " ◐" : ""} · ${r.busy ? esc(cur.slice(0, 14)) : "boşta"}</span>`;
}
function drawSel() {
  const b = $("selbox"); if (!b) return;
  const k = Object.keys(S.sel);
  b.innerHTML = k.length ? k.map(n => `<div class="qrow selrow"><span class="dot s" style="background:${hexOf(n)}"></span><b>${esc(n)}</b><input class="inp sq" type="number" inputmode="numeric" min="1" value="${S.sel[n]}" data-c="${esc(n)}"></div>`).join("")
    : '<span class="hint">Henüz renk seçilmedi.</span>';
}
function drawChips() {
  const box = $("chips"); if (!box) return;
  const q = lc(S.cin.trim());
  const list = allCust().filter(n => !q || lc(n).includes(q)).slice(0, 40);
  box.innerHTML = list.length ? list.map(n => `<button class="chip" data-act="pick-cust" data-v="${esc(n)}">${esc(n)}</button>`).join("")
    : '<span class="hint">Kayıtlı müşteri yok — adı yazıp Tamam\'a basın.</span>';
}
function toast(m) { const t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 2000); }
function go(v) { S.view = v; render(); }
function startOrder(name) { S.order = { id: uid(), cust: name, created: Date.now(), saved: false, lines: [] }; go("prod"); }
function goHome() {
  if (S.order && !S.order.saved && S.order.lines.length && !confirm("Kaydedilmemiş sipariş silinecek. Çıkılsın mı?")) return;
  S.order = null; S.bk = null; go("home");
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, o = S.order;
  if (a === "new") { S.order = null; S.cin = ""; go("cust"); }
  else if (a === "pick-cust") startOrder(b.dataset.v);
  else if (a === "cust-ok") { const v = S.cin.trim(); if (!v) return toast("Müşteri adı yazın"); startOrder(v); }
  else if (a === "prod") { S.pk = b.dataset.k; S.sel = {}; go("color"); }
  else if (a === "color") { const n = b.dataset.v; if (S.sel[n]) delete S.sel[n]; else S.sel[n] = 1; b.classList.toggle("sel", !!S.sel[n]); drawSel(); }
  else if (a === "addline") {
    const cs = Object.keys(S.sel); if (!cs.length) return toast("En az bir renk seçin");
    cs.forEach(c => o.lines.push({ id: uid(), k: S.pk, color: c, qty: S.sel[c], done: 0, asg: {} }));
    persist(); go("order");
  }
  else if (a === "open") { S.order = orders.find(x => x.id === b.dataset.id); go("order"); }
  else if (a === "addmore") go("prod");
  else if (a === "show") go("res");
  else if (a === "more") { S.all[b.dataset.id] = true; render(true); }
  else if (a === "save") { o.saved = true; orders.push(o); pushOrder(o); toast("Kaydedildi ✓"); render(true); }
  else if (a === "delord") { if (confirm("Bu sipariş silinsin mi?")) { orders = orders.filter(x => x.id !== o.id); cache(); ordRef?.child(o.id).remove().catch(() => toast("Firebase'den silinemedi")); S.order = null; go("home"); } }
  else if (a === "del-line") { o.lines = o.lines.filter(l => l.id !== b.dataset.id && !(l.comp && l.comp.of === b.dataset.id)); persist(); render(true); }
  else if (a === "asg") {
    if (!o.saved) return toast("Önce siparişi kaydedin");
    const ln = o.lines.find(x => x.id === b.dataset.line), m = b.dataset.m, lm = looms[m]; if (!ln || !lm) return;
    ln.asg = ln.asg || {};
    if (ln.asg[m] !== undefined) {
      /* atamayı kaldır -> eşlik eden satır da silinir */
      delete ln.asg[m];
      o.lines = o.lines.filter(x => !(x.comp && x.comp.of === ln.id && x.comp.m === m));
    } else {
      ln.asg[m] = wingSig(lm);
      /* 140'lık makinede iki kanat birlikte çalışır: diğer kanadın rengi de aynı adette sipariş olur */
      const p = prodOf(ln.k), full = p && !p.roll && p.opts.some(x => x.mw === 140 && x.ac === 1);
      if (lm.width === 140 && p && !full) {
        const wings = [lm.colors[0], lm.colors[3]], other = wings.find(c => c !== ln.color);
        const hasComp = o.lines.some(x => x.comp && x.comp.of === ln.id);
        const hasPartner = o.lines.some(x => x !== ln && !x.comp && x.k === ln.k && x.color === other && rem(x) > 0);
        if (wings.filter(c => c === ln.color).length === 1 && other && other !== "0" && !hasComp && !hasPartner) {
          o.lines.push({ id: uid(), k: ln.k, color: other, qty: ln.qty, done: 0, asg: { [m]: wingSig(lm) }, comp: { of: ln.id, m } });
          toast(`Eşlik eden satır eklendi: ${other} × ${ln.qty}`);
        }
      }
    }
    persist(); render(true);
  }
  else if (a === "back") {
    const prev = { cust:"home", prod: o?.lines.length ? "order" : "cust", color:"prod", order:"home", res:"order" }[S.view];
    if (!prev) return;
    if (prev === "home") goHome(); else go(prev);
  }
  else if (a === "home") goHome();
  else if (a === "bk-out") { S.bk = "out"; render(true); }
  else if (a === "bk-in") { S.bk = "in"; render(true); }
  else if (a === "bk-apply") {
    try {
      const arr = JSON.parse($("bk").value);
      if (!Array.isArray(arr) || arr.some(x => !x || !Array.isArray(x.lines))) throw 0;
      orders = arr; orders.forEach(pushOrder); S.bk = null; toast("Geri yüklendi ✓"); render(true);
    } catch { toast("Geçersiz yedek metni"); }
  }
});
document.addEventListener("input", e => {
  if (e.target.classList.contains("sq")) S.sel[e.target.dataset.c] = Math.max(1, parseInt(e.target.value, 10) || 1);
});
document.addEventListener("change", e => {
  const c = e.target.classList, o = S.order;
  if (!o || !(c.contains("dn-in") || c.contains("q-in"))) return;
  const l = o.lines.find(x => x.id === e.target.dataset.id); if (!l) return;
  const v = parseInt(e.target.value, 10) || 0;
  if (c.contains("q-in")) {
    /* adet değişince eşlik eden satırın adedi de değişir */
    l.qty = Math.max(1, v); l.done = Math.min(l.done || 0, l.qty);
    o.lines.forEach(x => { if (x.comp && x.comp.of === l.id) { x.qty = l.qty; x.done = Math.min(x.done || 0, x.qty); } });
  } else l.done = Math.min(l.qty, Math.max(0, v));
  persist(); render(true);
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "cin") document.querySelector('[data-act="cust-ok"]').click(); });

/* ---------- Firebase ----------
   Bu sayfa YAZAR: kale_siparis_v1
   Bu sayfa sadece OKUR: kale_dokuma_live_v2 (makineler), kale_customers_pool_v2 (müşteriler) */
function setSync(on, t) { $("sync").classList.toggle("on", on); $("sync").textContent = t; }
function authMsg(e) {
  const c = (e && e.code) || "";
  if (c === "auth/network-request-failed") return "Bağlantı yok. İnterneti kontrol edin.";
  if (c === "auth/too-many-requests") return "Çok fazla deneme. Biraz bekleyip tekrar deneyin.";
  if (c === "auth/user-disabled") return "Bu hesap devre dışı.";
  if (c === "auth/invalid-email") return "E-posta adresi geçersiz.";
  return "E-posta veya şifre hatalı.";
}

let dataStarted = false;
function showLogin(msg) {
  $("lock").style.display = "flex";
  const e = $("loginErr"); e.textContent = msg || ""; e.style.display = msg ? "block" : "none";
  $("loginBtn").disabled = false;
}
function signOut() {
  const done = () => { try { localStorage.removeItem("kale_dokuma_local_v3"); localStorage.removeItem("kale_customers_list_v3"); localStorage.removeItem(OKEY); } catch {} location.reload(); };
  if (typeof firebase !== "undefined" && firebase.apps.length) firebase.auth().signOut().then(done, done); else done();
}
const denied = e => { if (e && (e.code === "PERMISSION_DENIED" || /permission/i.test(e.message || ""))) { toast("Bu hesabın yetkisi yok"); setTimeout(signOut, 1800); } };

function initFb() {
  $("loginForm").addEventListener("submit", ev => {
    ev.preventDefault();
    if (typeof firebase === "undefined" || !firebase.apps.length) return showLogin("Bağlantı kurulamadı. İnterneti kontrol edip sayfayı yenileyin.");
    $("loginBtn").disabled = true;
    firebase.auth().signInWithEmailAndPassword($("loginEmail").value.trim(), $("loginPass").value)
      .then(() => { $("loginPass").value = ""; })
      .catch(e => showLogin(authMsg(e)));
  });
  $("outBtn").onclick = signOut;
  if (typeof firebase === "undefined") { setSync(false, "Bağlantı yok"); return showLogin("Firebase yüklenemedi. İnterneti kontrol edip sayfayı yenileyin."); }
  try {
    firebase.initializeApp({
      apiKey: "AIzaSyBWWp1Le6f3y__f7WWoFVvYw9MwdHwFYjc",
      authDomain: "fabrika-e9b49.firebaseapp.com",
      databaseURL: "https://fabrika-e9b49-default-rtdb.firebaseio.com",
      projectId: "fabrika-e9b49",
      storageBucket: "fabrika-e9b49.firebasestorage.app",
      messagingSenderId: "208016312960",
      appId: "1:208016312960:web:db8531b655252e19ecf465"
    });
    firebase.auth().onAuthStateChanged(user => {
      if (user) { $("lock").style.display = "none"; startData(); }
      else if (!dataStarted) showLogin();
      else location.reload();
    });
  } catch { setSync(false, "Bağlantı yok"); showLogin("Firebase başlatılamadı."); }
}

function startData() {
  if (dataStarted) return; dataStarted = true;
  const db = firebase.database();
  ordRef = db.ref("kale_siparis_v1/orders");
  ordRef.on("value", s => {
    const remote = Object.values(s.val() || {}).map(normOrder);
    if (firstOrd) {
      firstOrd = false;
      const have = new Set(remote.map(o => o.id)), localOnly = orders.filter(o => !have.has(o.id));
      orders = [...remote, ...localOnly];
      const sig = o => JSON.stringify(o.lines.map(l => [l.ok, l.pn, l.full, Object.keys(l.mt || {}).sort().map(k => [k, l.mt[k]])]));
      orders.forEach(o => { const b = sig(o); prep(o); if (localOnly.includes(o) || sig(o) !== b) pushOrder(o); });
    } else orders = remote;
    cache();
    if (S.order?.saved) {
      const fnd = orders.find(o => o.id === S.order.id);
      if (fnd) S.order = fnd; else { S.order = null; if (["order","res","color","prod"].includes(S.view)) S.view = "home"; }
    }
    if (["home","order","res"].includes(S.view)) render(true);
  }, e => { toast("Siparişler Firebase'den okunamadı"); denied(e); });
  db.ref("kale_dokuma_live_v2").on("value", s => {
    const r = s.val() || {};
    ids.forEach(id => { if (r[id]) looms[id] = norm(r[id], id); });
    setSync(true, "Canlı veri ✓");
    if (S.view === "res") render(true); else drawChips();
  }, e => { setSync(false, "Yerel veri"); denied(e); });
  db.ref("kale_customers_pool_v2").on("value", s => {
    const v = s.val(); customers = v ? Object.values(v).filter(Boolean) : []; drawChips();
  }, denied);
}
render(); initFb();
</script>
