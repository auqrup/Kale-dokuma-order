/* ============================================================
   KALE DOKUMA - SIPARIS YONLENDIRME SAYFASI (siparis.html)  -- BELGE / DOCUMENTATION
   Ayrintili belge icin README.md dosyasina bakin.

   NE YAPAR: Musteri siparisi alir (musteri > urun/olcu > renk(ler) > sonuc) ve
   siparisin hangi tezgahlara verilebilecegini onerir (suggest). Siparis satirlari
   tezgaha atanabilir (pin), yapilan adet takip edilir.

   VERI: YAZAR kale_siparis_v1/orders ve kale_customers_pool_v2 (musteri listesi; musteri ekleme/silme SADECE bu sayfada).
   OKUR kale_dokuma_live_v2 (tezgahlar) ve kale_colors_v2 (renk listesi) - bunlari ASLA yazmaz.

   TEMEL KURALLAR:
   - P[] urun tablosu ve FULL140 / ONLY100 asagida duzenlenir.
   - FULL140: 140 cm tezgahlardan sadece bunlar tam 140 cm genislikte uretir
     (Karaman 1 = "K1"). Diger 140 cm tezgahlar 70 cm'lik iki kanatla calisir.
   - ONLY100: 200 cm tezgahlardan sadece 100 cm genislikte halı yapan TEK tezgah.
     = ["A3"] (Acar 3). 100 cm halilarda (100x200/300/400) 1 parca. Jakar ayari yuzunden 200 cm genislikte hali (200x300, 200x400), cemaat seccadesi 110x200 ve 60x80 URETMEZ; ama 200 cm genislikte KUMAS (rulo) uretir.
   - Eslesme sadece ANA renk + genislige gore yapilir (alt renk/cozgu gorsel).
   - 140 cm kanat kurali: renk sadece bir kanatta varsa diger kanat da kendi rengini
     uretir; musteri o rengi de almak zorundadir. suggest() puani: 2 = iki kanat da
     ayni renk, 1.5 = diger kanat rengi ayni siparisin baska satirinda var,
     1 = diger kanat uyumsuz (uyari + zorunlu miktar), 0 = uyumsuz.
   - ESLIK SATIR (comp:{of, m}): satir 140 cm kanatli tezgaha atanirsa ve diger kanatta
     baska bir renk varsa, ayni musteri/ayni adet icin otomatik satir olusur. Asil
     satir silinir/atama kalkarsa silinir; adet degisirse eslik de degisir.
     "Yapilan" (done) asil satir ve esligi arasinda BAGLIDIR: biri degisince digeri de
     ayni degere gelir (ikisi ayni siralarda ayni anda uretilir).
   - Metraj: duz urunlerde satir sayisi x parca boyu; rulolarda rulo sayisi x rulo metresi
     (140=40m, 160=35m, 200=30m; kumas rulo ADEDI ile siparis edilir, metre ile degil).
     Halilar once kumas gibi ardisik uretilir, sonra elle kesilir (metre buna gore).
   - Cemaat seccadesi 110x200: SADECE 200 cm tezgahlarda; parca boyu 110 cm (1,1 m/parca).
   - 60x80 (Kadife hali grubu): 200 cm tezgahta 3 sutun 60+80+60; ortadaki parca dondurulmus.
     480 cm'lik devirde 6+8+6 = 20 parca (cyc:4.8 m, ac:20) -> parca basina 0,24 m.
     Kesirli devir yukari yuvarlanir; hesap yaklasiktir.
   - 140 cm tezgahlar (kumas da dahil): iki kanat TEK 140 cm'lik kumas uretir, ortadan
     kesilir. Kanatlar farkli renkteyse iki renk de cikar; musteri ikisini de kabul eder
     ya da siparis reddedilir (esdeger satir mantigi bunu gosterir).

   GIRIS: Firebase Authentication (e-posta/sifre). Giris yapilmadan veri dinlenmez.
   ============================================================ */
/* ============ AYARLAR (gerektiğinde burayı düzenleyin) ============ */
const FULL140 = ["K1"];   // 140 cm TAM genişlikte halı/seccade yapabilen makineler
const ONLY100 = ["A3"];  // 200'lük makineler içinde SADECE 100 cm halı yapan tek makine: Acar 3

/* Cemaat seccadesi 110×200: sadece 200 cm tezgahlarda, 200 cm tezgah eninde, parça boyu 110 cm (w=200, l=110).
   60×80: 200 cm tezgahta 3 sütun (60 + 80 + 60); yan sütunlarda parça 60 en x 80 boy, ortada döndürülmüş (80 en x 60 boy).
   480 cm'lik bir DEVİRDE 6 + 8 + 6 = 20 parça çıkar -> ac:20 parça/devir, cyc:4.8 m/devir (parça başı 0,24 m).
   Ürünler: w=en, l=boy (cm). opts: hangi makine eninde, yan yana kaç parça (ac) üretilir.
   need:"full140" -> sadece FULL140 makineleri | no100:true -> ONLY100 makineleri hariç | ac100 -> ONLY100 makinesinde parça sayısı */
const P = [
  { k:"s70", g:"Seccade", name:"70 × 110", w:70, l:110, opts:[{ mw:140, ac:2 }] },
  { k:"s80", g:"Seccade", name:"80 × 120", w:80, l:120, opts:[{ mw:160, ac:2 }] },

  { k:"h60x80", g:"Kadife halı", name:"60 × 80", w:60, l:80, opts:[{ mw:200, ac:20, cyc:4.8, note:"6+8+6", no100:true }] },
  { k:"h100", g:"Kadife halı", name:"100 × 200", w:100, l:200, opts:[{ mw:200, ac:2, ac100:1 }] },
  { k:"h100x300", g:"Kadife halı", name:"100 × 300", w:100, l:300, opts:[{ mw:200, ac:2, ac100:1 }] },
  { k:"h100x400", g:"Kadife halı", name:"100 × 400", w:100, l:400, opts:[{ mw:200, ac:2, ac100:1 }] },
  { k:"h140", g:"Kadife halı", name:"140 × 200", w:140, l:200, opts:[{ mw:140, ac:1, need:"full140" }] },
  { k:"h160", g:"Kadife halı", name:"160 × 250", w:160, l:250, opts:[{ mw:160, ac:1 }] },
  { k:"h200x300", g:"Kadife halı", name:"200 × 300", w:200, l:300, opts:[{ mw:200, ac:1, no100:true }] },
  { k:"h200x400", g:"Kadife halı", name:"200 × 400", w:200, l:400, opts:[{ mw:200, ac:1, no100:true }] },
  { k:"afg2", g:"AFGAN SET2", name:"148 × 200", w:200, l:148, opts:[{ mw:200, ac:1, no100:true }] },
  { k:"afg3", g:"AFGAN SET3", name:"172 × 200", w:200, l:172, opts:[{ mw:200, ac:1, no100:true }] },
  { k:"afg4", g:"AFGAN SET4", name:"200 × 196", w:200, l:196, opts:[{ mw:200, ac:1, no100:true }] },
  /* Kumaş: ENE ve TÜRE göre ayrı ürünler. ftype: "simli" (lureks'li) | "spingel" (lureks'siz). Sadece AYNI enli VE AYNI türdeki makineler önerilir
     (makine türü index.html'deki makine kartından gelir: extra === "simli" ise SİMLİ, aksi halde ŞPİNGEL sayılır). */
  { k:"k140simli", g:"Kumaş 140 cm", name:"SİMLİ", roll:true, fw:140, ftype:"simli", opts:[{ mw:140, len:40 }] },
  { k:"k140spingel", g:"Kumaş 140 cm", name:"ŞPİNGEL", roll:true, fw:140, ftype:"spingel", opts:[{ mw:140, len:40 }] },
  { k:"k160simli", g:"Kumaş 160 cm", name:"SİMLİ", roll:true, fw:160, ftype:"simli", opts:[{ mw:160, len:35 }] },
  { k:"k160spingel", g:"Kumaş 160 cm", name:"ŞPİNGEL", roll:true, fw:160, ftype:"spingel", opts:[{ mw:160, len:35 }] },
  { k:"k200simli", g:"Kumaş 200 cm", name:"SİMLİ", roll:true, fw:200, ftype:"simli", opts:[{ mw:200, len:30 }] },
  { k:"k200spingel", g:"Kumaş 200 cm", name:"ŞPİNGEL", roll:true, fw:200, ftype:"spingel", opts:[{ mw:200, len:30 }] },
  /* ESKİ ürün: eski siparişlerdeki satırlar k:"rulo" tutuyor; SİLMEYİN. Seçim ekranında gösterilmez (hidden). */
  { k:"rulo", g:"Kumaş", name:"Rulo", roll:true, hidden:true, opts:[{ mw:140, len:40 }, { mw:160, len:35 }, { mw:200, len:30 }] }
];
/* ================================================================== */

/* Sabit renk listesi shared.js içindeki FIXED_COLORS'tur ("0" burada yok → renk listelerinde görünmez). Ek renkler Firebase kale_colors_v2'den gelir. */
const COLORS = { ...FIXED_COLORS };
const hexOf = n => COLORS[n] || NO_COLOR_HEX;
/* Ek renkler: Firebase kale_colors_v2 = { v:2, list:[{name,hex}] } (index.html yazar, bu sayfa sadece OKUR). Sabit liste yukarıdaki COLORS'tur.
   Ham makine renkleri saklanır ki ek renkler sonradan gelirse/değişirse yeniden doğrulanabilsin. */
const FIXED_COLOR_NAMES = new Set(Object.keys(COLORS));
const CCOL_KEY = "kale_colors_extra_cache";
const rawColors = {};
function applyExtraColors(list) {
  Object.keys(COLORS).forEach(k => { if (!FIXED_COLOR_NAMES.has(k)) delete COLORS[k]; });
  const arr = Array.isArray(list) ? list : Object.values(list || {});
  const kept = [];
  arr.forEach(c => {
    if (c && typeof c.name === "string" && c.name !== "0" && /^#[0-9a-fA-F]{6}$/.test(c.hex || "") && !(c.name in COLORS)) { COLORS[c.name] = c.hex.toLowerCase(); kept.push({ name: c.name, hex: c.hex.toLowerCase() }); }
  });
  try { localStorage.setItem(CCOL_KEY, JSON.stringify(kept)); } catch {}
}
try { applyExtraColors(JSON.parse(localStorage.getItem(CCOL_KEY) || localStorage.getItem("kale_colors_cache_v2") || "[]")); } catch {}
const WARP_DEF = ["BEYAZ", "SİYAH"];
const STATUS = { running:["Çalışıyor","var(--run)"], stopped:["Durduruldu","var(--stop)"], yarn:["İplik yok","var(--yarn)"], maint:["Arıza/Bakım","var(--mnt)"] };
const OKEY = "kale_siparis_local_v1";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const $ = id => document.getElementById(id);
const lc = s => s.toLocaleLowerCase("tr");
const uid = () => Math.random().toString(36).slice(2, 9);
const ids = Object.entries(BRANCHES).flatMap(([b, o]) => Array.from({ length:o.count }, (_, i) => b + (i + 1)));

function norm(l, id) {
  const n = parseInt(id.slice(1), 10);
  const m = { id, branch:id[0], num:n, width:WIDTHS[(n - 1) % 3], status:"running", currentCustomer:"", ...l };
  delete m.nextCustomer;   /* "Gelecek müşteri" fikri kaldırıldı */
  m.width = Number(m.width) || WIDTHS[(n - 1) % 3];
  const c = Array.isArray(m.colors) ? m.colors.map(x => x?.name ?? x) : [];
  m.colors = Array.from({ length: m.width === 140 ? 6 : 4 }, (_, i) => (c[i] in COLORS ? c[i] : "0"));
  const w = Array.isArray(m.warps) ? m.warps.map(x => x?.name ?? x) : [];
  m.warps = [0, 1].map(i => (w[i] in WARPS ? w[i] : WARP_DEF[i]));
  return m;
}
let looms = {}, customers = [], orders = [], ordRef = null, custRef = null, notesRef = null, custNotes = {}, pricesRef = null, custPrices = {}, firstOrd = true;
try {
  const c = JSON.parse(localStorage.getItem("kale_dokuma_local_v3") || "null");
  ids.forEach(id => looms[id] = norm(c?.[id], id));
  customers = JSON.parse(localStorage.getItem("kale_customers_list_v3") || "[]");
} catch { ids.forEach(id => looms[id] = norm(null, id)); }
try { orders = JSON.parse(localStorage.getItem(OKEY) || "[]"); } catch { orders = []; }
const cache = () => { try { localStorage.setItem(OKEY, JSON.stringify(orders)); } catch {} };
const wingSig = m => (m.width === 140 ? [m.colors[0], m.colors[3]] : [m.colors[0]]).join("|");
/* Satırın bu makinede tahmini tezgah metresi (kalan adet üzerinden) */
/* Üretim süresi: günlük üretim tablosu DAILY shared.js içindedir. Özellik seçilmemişse SİMLİ varsayılır. */
const dailyRate = l => (DAILY[l.width] || DAILY[200])[l.extra === "spingel" ? "spingel" : "simli"];
const unsetExtra = l => l.width !== 200 && l.extra !== "spingel" && l.extra !== "simli";
const fmtDays = d => `${String(Math.max(0.1, Math.round(d * 10) / 10)).replace(".", ",")} gün`;
const daysTxt = (l, m) => `≈ ${fmtDays(m / dailyRate(l))}${unsetExtra(l) ? " (simli varsayıldı)" : ""}`;
function lineM(ln, m) {
  const e = (ln.mt || {})[m?.id]; if (!e) return null;
  const R = rem(ln); let [ac, len] = e;
  if (!ac) return Math.round(R * len * 10) / 10;
  const hit = (m.width === 140 ? [m.colors[0], m.colors[3]] : [m.colors[0]]).filter(c => c === ln.color).length;
  if (m.width === 140 && ac === 2 && (ln.color2 || hit === 1)) ac = 1;
  return Math.round(Math.ceil(R / ac) * len * 10) / 10;
}
/* makine türü: index.html makine kartındaki extra; "simli" değilse (boş dahil) ŞPİNGEL */
const loomType = l => l.extra === "simli" ? "simli" : "spingel";
function eligible(p, l) {
  return p.opts.find(o => o.mw === l.width
    && (o.need !== "full140" || FULL140.includes(l.id))
    && !(o.no100 && ONLY100.includes(l.id))
    && (!p.ftype || loomType(l) === p.ftype));
}
/* Her satıra: ürün adı, boyut olarak uygun makineler (ok), tam-en bilgisi (full). Ana sayfa bunları okur. */
function prep(o) {
  o.lines.forEach(l => {
    const p = prodOf(l.k); if (!p) return;
    l.pn = pname(p);
    l.mt = {};  /* makine -> [yan yana parça (devirli üründe devir başına parça), parça başına metre (devirli üründe devir metresi)]; rulo için [0, rulo metresi] */
    Object.values(looms).forEach(m => {
      const o = eligible(p, m); if (!o) return;
      l.mt[m.id] = p.roll ? [0, o.len] : [(ONLY100.includes(m.id) && o.ac100) ? o.ac100 : o.ac, o.cyc || p.l / 100];
    });
    l.ok = Object.keys(l.mt);
    l.full = !p.roll && p.opts.some(x => x.mw === 140 && x.ac === 1);
    l.asg = l.asg || {};
  });
}
function pushOrder(o) {
  prep(o); cache();
  if (ordRef) ordRef.child(o.id).set(JSON.parse(JSON.stringify(o))).catch(() => toast("Firebase'e yazılamadı (yerelde saklandı)"));
}
const arr = x => Array.isArray(x) ? x : Object.values(x || {});
const normOrder = x => ({ ...x, saved: true, todos: undefined, stt: x.stt || (x.pot ? "pot" : undefined), pot: undefined, steps: x.steps ? arr(x.steps) : (x.next && (x.next.t || x.next.d) ? [{ id: "n0", t: x.next.t || "Hatırlatma", d: x.next.d || "", ok: false }] : []), next: undefined, lines: arr(x.lines).map(l => ({ ...l, ok: arr(l.ok), asg: l.asg || {} })) });

function allCust() {
  const m = new Map();
  [...customers, ...orders.filter(o => !o.kind || o.kind === "payment").map(o => o.cust), ...Object.values(looms).flatMap(l => [l.currentCustomer])].forEach(n => {

let S = { view:"home", order:null, cin:"", pk:null, sel:{}, all:{}, bkp:null, hq:"", hf:"all", hs:"due", sheet:null, dirty:false, draft:null, sdirty:false, hst:"all" };
const prodOf = k => P.find(p => p.k === k);
const rem = l => Math.max(0, (l.qty || 0) - (l.done || 0));
/* TESPİT (pin): satır makineye atanmış VE şu an o makinede çalışıyor. ln.pin = { makine: zaman }. Satır bitince (kalan 0) otomatik düşer; bir makinede birden fazla sabitlenmiş satır olabilir. */

const pinsOf = l => Object.keys(l.pin || {}).filter(m => isPinned(l, m));
const sinceTxt = t => { const d = Math.floor((Date.now() - t) / 864e5); return d <= 0 ? "bugün" : d + " gün"; };
/* ÇİFT satır (140 cm iki kanat): color + color2 TEK satırda, tek adet; iki kanat aynı anda çalışır */

const pname = p => p.roll ? (p.ftype ? `Kumaş ${p.fw} cm ${p.name}` : "Rulo kumaş") : `${p.g} ${p.name}`;
/* Tarih: o.created = oluşturma (ms), o.due = tahmini bitiş ("YYYY-MM-DD", boş olabilir) */
const fmtDue = d => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ""); return m ? `${m[3]}.${m[2]}.${m[1]}` : ""; };
const clone = x => JSON.parse(JSON.stringify(x));
/* Kayıtlı siparişte değişiklikler TASLAK olarak S.order (kopya) üzerinde tutulur; Firebase'e SADECE "Kaydet" ile yazılır. */
const persist = () => { if (S.order?.saved) { S.dirty = true; drawBar(); } };
/* ---------- YENİ SİPARİŞ AKIŞI: ① Müşteri › ② Ürün › ③ Renk › ④ Özet › ⑤ Makine ---------- */
const FLOW = [["cust", "Müşteri"], ["prod", "Ürün"], ["color", "Renk"], ["order", "Özet"], ["res", "Makine"]];
const flowActive = (V, o) => V === "cust" || !!(o && !o.saved && ["prod", "color", "order", "res"].includes(V));
function flowHtml(V, o) {

  return (o ? `<div class="fhd"><b class="fname">${esc(o.cust)}</b><label class="fno">No<input class="inp no-in" maxlength="12" value="${esc(o.no || "")}"></label></div>` : "") +

}
function newBarHtml(V, o) {

  return '<button type="button" data-act="flow" data-v="order">← Özet</button><button type="button" class="vs" data-act="save">💾 Kaydet</button>';

function drawBar() {

function commitNew() {   /* yeni siparişi ilk kez kaydeder (Özet'te Kaydet / çıkışta "kaydedilsin mi?") */
  const o = S.order; o.saved = true;
  const stored = clone(o); orders.push(stored); pushOrder(stored);

}
function saveOrder(quiet) {
  const o = S.order; if (!o || !o.saved) return;
  if (!S.dirty) { if (!quiet) toast("Değişiklik yok"); return; }
  const stored = clone(o), i = orders.findIndex(x => x.id === o.id);
  if (stored.lines.length && stored.stt === "pot") delete stored.stt;   /* ürün eklendi: "Muhtemel" etiketi kalkar (otomatik Sipariş/Tamamlandı) */
  delete stored.pot;

function leaveOk() {   /* kaydedilmemiş değişiklik varsa sorar; true = çıkılabilir */

/* ---------- Öneri motoru ---------- */
function suggest(line, order) {
  const p = prodOf(line.k), R = rem(line), res = [];
  Object.values(looms).forEach(l => {
    const o = eligible(p, l);
    if (!o) return;
    const only100 = ONLY100.includes(l.id), two = l.width === 140;
    const wings = two ? [l.colors[0], l.colors[3]] : [l.colors[0]];
    const ac = p.roll ? 0 : ((only100 && o.ac100) ? o.ac100 : o.ac);
    const r = { l, wings, only100, ac, busy: !!(l.currentCustomer || "").trim(), maint: l.status === "maint", notes: [], waste: 0, pref: 0 };
    const hit = wings.filter(c => c === line.color).length;
    const half = p.roll ? R : Math.ceil(R / ac);
    let rows = half;
    if (line.color2) {
      /* çift satır: iki kanat da istenen iki renk olmalı (sırası fark etmez); her devirde iki renkten birer parça */
      const [w1, w2] = wings;
      r.match = (two && !(!p.roll && ac === 1) && ((w1 === line.color && w2 === line.color2) || (w1 === line.color2 && w2 === line.color))) ? 2 : 0;
      rows = R;
    } else if (!two) r.match = hit ? 2 : 0;
    else if (!p.roll && ac === 1) {
      /* 140 tam en: iki kanat tek parça çalışır, ikisi de aynı renk olmalı */
      r.match = hit === 2 ? 2 : 0; rows = R;
      if (hit === 1) r.notes.push(["bad", "Kanat renkleri farklı; tam en için ikisi de aynı olmalı"]);
    } else if (hit === 2) r.match = 2;
    else if (hit === 1) {
      /* İki kanat birlikte çalışır: diğer kanadın rengi de üretilir, müşteri onu da almak zorunda */
      const other = wings.find(c => c !== line.color);
      const partner = order.lines.find(x => x !== line && !x.comp && !x.color2 && x.k === line.k && x.color === other && rem(x) > 0);
      rows = R;
      if (partner) { r.match = 1.5; r.notes.push(["ok", `✓ Diğer kanat (${other}) siparişteki başka satırı da karşılıyor (${rem(partner)} adet)`]); }
      else { r.match = 1; r.notes.push(["warn", `⚠ Diğer kanat ${other}: müşteri bu rengi de almak zorunda${p.roll ? "" : ` (${R} adet fazladan ${other})`}`]); }
    } else r.match = 0;
    if (p.roll) { r.len = o.len; r.rows = rows; r.total = rows * o.len; r.pref = WIDTHS.indexOf(l.width); }
    else { r.rows = rows; r.meters = Math.round(rows * (o.cyc ? o.cyc * 100 : p.l)) / 100; r.waste = o.cyc ? 0 : Math.max(0, Math.round((1 - ac * p.w / l.width) * 100)); r.cyc = !!o.cyc; r.note = o.note || ""; }
    res.push(r);
  });
  const key = r => (2 - r.match) * 1e6 + (r.maint ? 5e5 : 0) + (r.busy ? 1e5 : 0) + r.waste * 1e3 + r.pref * 100 + r.l.num;
  return res.sort((a, b) => key(a) - key(b));
}

/* ---------- Müşteri listesi (kale_customers_pool_v2: SADECE bu sayfa YAZAR; index.html okur) ----------
   Yazma işlemleri TRANSACTION ile yapılır: liste henüz yüklenmeden / başka cihaz aynı anda yazarken eski listeyle ÜZERİNE yazılmaz. */
const cleanName = raw => String(raw || "").trim().replace(/\s+/g, " ");
function poolWrite(fn) {
  if (!custRef) return Promise.resolve();
  return custRef.transaction(cur => fn(arr(cur).filter(Boolean))).catch(() => toast("Müşteri listesi kaydedilemedi: yetkiniz yok veya bağlantı yok"));
}
function addCustomer(raw) {   /* varsa mevcut yazımı döndürür; listede yoksa listeye ekler */
  const name = cleanName(raw);
  if (!name || name === "-") return null;
  const ex = allCust().find(n => lc(n) === lc(name)) || name;
  if (!customers.some(c => lc(c) === lc(ex))) {
    customers = [...customers, ex];
    poolWrite(a => a.some(c => lc(c) === lc(ex)) ? undefined : [...a, ex]);
  }
  return ex;
}
function custUse(n) {
  return { ord: orders.filter(o => lc(o.cust || "") === lc(n)).length,
           loom: Object.values(looms).filter(l => lc(l.currentCustomer || "") === lc(n)).length };
}
function delCustomer(n) {
  const u = custUse(n);
  if (u.ord || u.loom) return alert(`"${n}" silinemez: ${u.ord} siparişi ve ${u.loom} makinede kaydı var.`);
  if (!confirm(`"${n}" silinsin mi?`)) return;
  customers = customers.filter(c => lc(c) !== lc(n));
  poolWrite(a => a.filter(c => lc(c) !== lc(n)));
  toast("Silindi"); render(true);
}

/* MÜŞTERİ ADI DEĞİŞTİRME (2026-11-21): tüm siparişlerde ad, müşteri listesi (pool), müşteri notu ve fiyatları yeni ada taşınır.
   Makine kayıtları (currentCustomer) index.html'e aittir → siparis.html onları DEĞİŞTİREMEZ; müşteri bir makinede kayıtlıysa ad değiştirme engellenir (silme kuralıyla aynı). */
function renameCustomer(oldName, raw) {
  const nu = cleanName(raw), ol = lc(oldName);
  if (!nu || nu === "-") return toast("Müşteri adı yazın");
  if (nu === oldName) return;
  const clash = allCust().find(n => lc(n) === lc(nu) && lc(n) !== ol);
  if (clash) return alert(`"${clash}" adlı müşteri zaten var.`);
  const u = custUse(oldName);
  if (u.loom) return alert(`"${oldName}" ${u.loom} makinede kayıtlı. Önce makine sayfasında bu müşteriyi o makinelerden kaldırın, sonra adı değiştirin.`);
  if (!confirm(`"${oldName}" → "${nu}"\n${u.ord} siparişte ad değişecek. Devam edilsin mi?`)) return;
  const upd = {};
  orders.forEach(o => { if (lc(o.cust || "") === ol) { o.cust = nu; upd[o.id + "/cust"] = nu; } });
  if (ordRef && Object.keys(upd).length) ordRef.update(upd).catch(() => toast("Siparişler Firebase'e yazılamadı"));
  customers = customers.filter(c => lc(c) !== ol); if (!customers.some(c => lc(c) === lc(nu))) customers = [...customers, nu];
  poolWrite(a => { const rest = a.filter(c => lc(c) !== ol); return rest.some(c => lc(c) === lc(nu)) ? rest : [...rest, nu]; });
  const ok = custKey(oldName), nk = custKey(nu);
  if (ok !== nk) [[custNotes, notesRef, CNOTE_CACHE], [custPrices, pricesRef, CPRICE_CACHE]].forEach(([obj, ref, ck]) => {
    if (!(ok in obj)) return;
    const v = obj[ok]; obj[nk] = v; delete obj[ok];
    try { localStorage.setItem(ck, JSON.stringify(obj)); } catch {}
    if (ref) ref.update({ [ok]: null, [nk]: v }).catch(() => toast("Müşteri verisi taşınamadı"));
  });
  if (S.order && lc(S.order.cust || "") === ol) S.order.cust = nu;
  if (S.draft && lc(S.draft.cust || "") === ol) S.draft.cust = nu;
  cache(); drawOrders(); if (S.sheet) drawSheet(); if (S.view === "custmgr" || S.view === "today") render(true);
  toast("Ad değişti ✓");
}

/* ---------- Rapor ---------- */
const todayMid = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const dueDays = o => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(o.due || ""); return m ? Math.round((new Date(+m[1], +m[2] - 1, +m[3]) - todayMid()) / 864e5) : null; };
function reportHtml() {

  };

    let h = `<tr class="oh"><td colspan="5"><b>${esc(lbl(o))}</b> · Oluşturma: ${new Date(o.created).toLocaleDateString("tr-TR")} · Teslim: ${dueTxt} · İlerleme: %${prog(o)}${stOf(o) !== "active" ? ` · Durum: ${esc(STT[stOf(o)].t)}` : ""}${o.pst ? ` · “${esc(o.pst)}”` : ""}</td></tr>`;

function availColors(k) {
  const p = prodOf(k), items = [], tot = {}, w2 = l => [l.colors[0], l.colors[3]];
  const twoMode = l => { const o = eligible(p, l); return l.width === 140 && !!o && !(!p.roll && o.ac === 1); };
  const pairOf = l => { const w = w2(l); return twoMode(l) && w[0] && w[1] && w[0] !== "0" && w[1] !== "0" && w[0] !== w[1] ? [...w].sort() : null; };
  const add = (id, extra, r) => { items.push({ c: id, ...extra, rs: [r], l: r.l }); const t = tot[id] = tot[id] || { f: 0, n: 0 }; t.n++; if (!r.busy) t.f++; };
  const pairKeys = new Set();
  Object.values(looms).forEach(l => { const pr = pairOf(l); if (pr) pairKeys.add(pr.join("|")); });
  Object.keys(COLORS).forEach(c => {
    suggest({ id: "_", k, color: c, qty: 1, done: 0, asg: {} }, { lines: [] }).filter(r => r.match > 0).forEach(r => { if (!pairOf(r.l)) add(c, {}, r); });
  });
  /* iki kanat farklı renkteyse tek renk değil ÇİFT sunulur: müşteri ikisini birlikte alır (iki kanat aynı anda çalışır) */
  pairKeys.forEach(key => {
    const [c1, c2] = key.split("|");
    suggest({ id: "_", k, color: c1, color2: c2, qty: 1, done: 0, asg: {} }, { lines: [] }).filter(r => r.match > 0).forEach(r => add(key, { pair: [c1, c2] }, r));
  });
  return items.sort((a, b) => (tot[b.c].f - tot[a.c].f) || (tot[b.c].n - tot[a.c].n) || (a.c < b.c ? -1 : a.c > b.c ? 1 : 0) || ((a.rs[0].busy ? 1 : 0) - (b.rs[0].busy ? 1 : 0)) || (ids.indexOf(a.l.id) - ids.indexOf(b.l.id)));
}

  const h = l.width === 140 ? grp("K1:", [[c[0], 1], [c[1], 0], [c[2], 0]]) + grp("K2:", [[c[3], 1], [c[4], 0], [c[5], 0]]) : grp("Alt:", [[c[1], 0], [c[2], 0], [c[3], 0]]);

  else if (a === "ord-discard") { if (confirm("Değişiklikler silinsin mi?")) { const x = orders.find(y => y.id === (o && o.id)); S.dirty = false; if (x) { S.order = clone(x); render(true); } else goHome(); } }
  else if (a === "menu") $("menuOv").classList.add("open")
  else if (a === "menu-close") $("menuOv").classList.remove("open")
  else if (a === "hf") { S.hf = S.hf === b.dataset.v ? "all" : b.dataset.v; drawOrders(); }
  else if (a === "today") go("today")
  else if (a === "td-done") doneStepFromToday(b.dataset.id, b.dataset.sid)
  else if (a === "td-open") openSheet(b.dataset.id)
  else if (a === "td-share") shareOut(todayShareText())
  else if (a === "td-copy") copyOut(todayShareText())
  else if (a === "undo") { const f = undoFn; hideUndo(); if (f) f(); }
  else if (a === "st-add") addStepFromInput()
  else if (a === "pr-add") { withOrd(x => { x.cprices = [...arr(x.cprices), { id: uid(), n: "", p: "" }]; }); drawSheet(); const ins = $("shBox").querySelectorAll(".pr-n"); if (ins.length) ins[ins.length - 1].focus(); }
  else if (a === "pr-del") { withOrd(x => { x.cprices = arr(x.cprices).filter(r => r.id !== b.dataset.id); }); drawSheet(); }
  else if (a === "st-tg") { withOrd(x => { const t = arr(x.steps).find(y => y.id === b.dataset.id); if (t) t.ok = !t.ok; }); drawSheet(); }
  else if (a === "st-del") { withOrd(x => { x.steps = arr(x.steps).filter(y => y.id !== b.dataset.id); }); drawSheet(); }
  else if (a === "stt") { withOrd(x => { if (b.dataset.v === "active") delete x.stt; else x.stt = b.dataset.v; }); drawSheet(); }
  else if (a === "no-prod") { if (!o || o.saved) return; const nc = { id: o.id, cust: o.cust, created: o.created, saved: true, lines: [], stt: "pot" }; if (o.no) nc.no = o.no; orders.push(nc); pushOrder(nc); S.order = null; S.dirty = false; go("home"); toast("Muhtemel kart kaydedildi ✓" + dupMsg(nc)); }   /* açık "Ürünsüz kaydet" düğmesi = bilinçli kayıt */
  else if (a === "pot-convert") { const x = orders.find(y => y.id === S.sheet); if (!x) return; if (!closeSheet()) return; S.order = clone(orders.find(y => y.id === x.id) || x); S.dirty = false; go("prod"); }
  else if (a === "pot-del") {
    const x = orders.find(y => y.id === S.sheet);
    if (x && confirm("Muhtemel sipariş silinsin mi?")) { closeSheet(true); orders = orders.filter(y => y.id !== x.id); cache(); ordRef?.child(x.id).remove().catch(() => toast("Firebase'den silinemedi")); drawOrders(); toast("Silindi"); }
  }
  else if (a === "open") { const x = orders.find(y => y.id === b.dataset.id); S.order = x ? clone(x) : null; S.dirty = false; go("order"); }
  else if (a === "addmore") go("prod");
  else if (a === "show") go("res");
  else if (a === "more") { S.all[b.dataset.id] = true; render(true); }
  else if (a === "save") { if (!o || o.saved || !o.lines.length) return; const st = commitNew(); render(true); toast("Sipariş kaydedildi ✓" + dupMsg(st)); }   /* kaydedince çıkmaz: Özet / Makine ekranında kalır */
  else if (a === "delord") { if (confirm("Bu sipariş silinsin mi?")) { orders = orders.filter(x => x.id !== o.id); cache(); ordRef?.child(o.id).remove().catch(() => toast("Firebase'den silinemedi")); S.order = null; S.dirty = false; go("home"); } }
  else if (a === "del-line") { o.lines = o.lines.filter(l => l.id !== b.dataset.id && !(l.comp && l.comp.of === b.dataset.id)); persist(); render(true); }
  else if (a === "pin") {
    const ln = o.lines.find(x => x.id === b.dataset.line), m = b.dataset.m; if (!ln || !(ln.asg && ln.asg[m] !== undefined)) return toast("Önce makineye atayın");
    const on = !isPinned(ln, m), grp = o.lines.filter(x => x === ln || (x.comp && x.comp.of === ln.id && x.comp.m === m));   /* eşlik eden satır birlikte */
    grp.forEach(x => { x.pin = x.pin || {}; if (on) x.pin[m] = Date.now(); else delete x.pin[m]; if (!Object.keys(x.pin).length) delete x.pin; });
    persist(); render(true); toast(on ? `🔒 ${m} makinesinde çalışıyor olarak işaretlendi` : "Sabitleme kaldırıldı");
  }
  else if (a === "asg") {
    const ln = o.lines.find(x => x.id === b.dataset.line), m = b.dataset.m, lm = looms[m]; if (!ln || !lm) return;
    ln.asg = ln.asg || {};
    if (ln.asg[m] !== undefined) {
      /* atamayı kaldır -> eşlik eden satır da silinir */
      delete ln.asg[m]; if (ln.pin) { delete ln.pin[m]; if (!Object.keys(ln.pin).length) delete ln.pin; }
      o.lines = o.lines.filter(x => !(x.comp && x.comp.of === ln.id && x.comp.m === m));
    } else {
      ln.asg[m] = wingSig(lm);
      /* 140'lık makinede iki kanat birlikte çalışır: diğer kanadın rengi de aynı adette sipariş olur */
      const p = prodOf(ln.k), full = p && !p.roll && p.opts.some(x => x.mw === 140 && x.ac === 1);
      if (lm.width === 140 && p && !full) {
        const wings = [lm.colors[0], lm.colors[3]], other = wings.find(c => c !== ln.color);
        const hasComp = o.lines.some(x => x.comp && x.comp.of === ln.id);
        const hasPartner = o.lines.some(x => x !== ln && !x.comp && !x.color2 && x.k === ln.k && x.color === other && rem(x) > 0);
        if (!ln.color2 && wings.filter(c => c === ln.color).length === 1 && other && other !== "0" && !hasComp && !hasPartner) {
          o.lines.push({ id: uid(), k: ln.k, color: other, qty: ln.qty, done: ln.done || 0, asg: { [m]: wingSig(lm) }, comp: { of: ln.id, m } });
          toast(`Eşlik eden satır eklendi: ${other} × ${ln.qty}`);
        }
      }
    }
    persist(); render(true);
  }
  else if (a === "back") {
    const prev = { backup:"home", report:"home", today:"home", custmgr:"home", cust:"home", prod: o?.lines.length ? "order" : (o?.saved ? "home" : "cust"), color:"prod", order: o && !o.saved ? "prod" : "home", res:"order" }[S.view];
    if (!prev) return;
    if (prev === "home") goHome(); else go(prev);
  }
  else if (a === "home") goHome();
  else if (a === "newkind") { if (!leaveOk()) return; S.order = null; go("home"); openNewCard(b.dataset.k); }
  else if (a === "backup") { S.bkp = null; go("backup"); }
  else if (a === "bk-dl") { const f = buildBackup(); downloadText(`kale-yedek-${ymdNow()}.json`, JSON.stringify(f)); toast(`Yedek indirildi ✓ (${f.orders.length} sipariş)`); }
  else if (a === "bk-pick") $("bkfile").click();
  else if (a === "bk-paste") bkLoad($("bkt").value);
  else if (a === "bk-apply") bkApply();
  else if (a === "bk-undo") bkUndo();
  else if (a === "bk-cancel") { S.bkp = null; render(true); }
});
document.addEventListener("input", e => {
  if (e.target.classList.contains("sq")) S.sel[e.target.dataset.c] = Math.max(1, parseInt(e.target.value, 10) || 1);
});
document.addEventListener("change", e => {
  const c = e.target.classList, o = S.order;
  if (o && c.contains("due-in")) { o.due = e.target.value || ""; persist(); return; }
  if (!o || !(c.contains("dn-in") || c.contains("q-in"))) return;
  const l = o.lines.find(x => x.id === e.target.dataset.id); if (!l) return;
  const v = parseInt(e.target.value, 10) || 0;
  if (c.contains("q-in")) {
    /* adet değişince eşlik eden satırın adedi de değişir */
    l.qty = Math.max(1, v); l.done = Math.min(l.done || 0, l.qty);
    o.lines.forEach(x => { if (x.comp && x.comp.of === l.id) { x.qty = l.qty; x.done = l.done; } });
  } else {
    /* "Yapılan" asıl satır ile eşlik eden satır(lar)da BİRLİKTE değişir (ikisi aynı sıralarda aynı anda üretilir) */
    l.done = Math.min(l.qty, Math.max(0, v));
    const root = l.comp ? l.comp.of : l.id;
    o.lines.forEach(x => { if (x.id === root || (x.comp && x.comp.of === root)) x.done = Math.min(x.qty, l.done); });
  }
  persist(); render(true);
});
document.addEventListener("input", e => {
  if (e.target.id === "hq") { S.hq = e.target.value; drawOrders(); }
  else if (e.target.classList && e.target.classList.contains("no-in") && S.order) { const v = cleanNo(e.target.value); if (v) S.order.no = v; else delete S.order.no; persist(); }
  else if (S.sheet && S.draft && e.target.classList) {   /* pencere: yazarken taslak güncellenir → Kaydet düğmesi hemen yanar (blur/change beklenmez) */
    const c = e.target.classList, v = e.target.value;
    const kf = ["kc-cust", "kc-no", "kc-amt", "kc-paid", "kc-due"].find(k => c.contains(k));
    if (kf) { const f = { "kc-cust": "cust", "kc-no": "cno", "kc-amt": "amt", "kc-paid": "paid", "kc-due": "due" }[kf]; withOrd(o => { o[f] = v; }); if (kf === "kc-amt" || kf === "kc-paid") { const I = $("shBox").querySelector(".shc .bd"); if (I && S.draft && !S.draft.stt) { const x = ordInfo(S.draft); I.textContent = x.txt; } } }
    else if (c.contains("ps-t")) withOrd(o => { o.pst = v; });
    else if (c.contains("no-t")) withOrd(o => { const n = cleanNo(v); if (n) o.no = n; else delete o.no; });
    else if (c.contains("nt-t")) withOrd(o => { o.cnote = v; });
    else if (c.contains("pr-n") || c.contains("pr-p")) withOrd(o => { const r = arr(o.cprices).find(y => y.id === e.target.dataset.id); if (!r) return; if (c.contains("pr-n")) r.n = v; else { const p = v.replace(/[^\d.,]/g, ""); if (p !== v) e.target.value = p; r.p = p; } });
  }
});
document.addEventListener("change", e => {
  const c = e.target.classList;
  if (c.contains("hs-sel")) { S.hs = e.target.value; drawOrders(); return; }
  if (c.contains("hs-sel2")) { S.hst = e.target.value; drawOrders(); return; }
  if (!S.sheet) return;
  if (c.contains("ps-t")) withOrd(o => { o.pst = e.target.value.trim(); });
  else if (c.contains("no-t")) withOrd(o => { const v = cleanNo(e.target.value); if (v) o.no = v; else delete o.no; });
  else if (c.contains("nt-t")) withOrd(o => { o.cnote = e.target.value.trim(); });
  else if (c.contains("st-dd")) { withOrd(o => { const st = arr(o.steps).find(y => y.id === e.target.dataset.id); if (st) st.d = e.target.value || ""; }); drawSheet(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $("menuOv").classList.remove("open"); closeSheet(); hideHov(); }
  else if (e.key === "Enter" && e.target.classList && e.target.classList.contains("st-new")) addStepFromInput();
  else if (e.key === "Enter" && e.target.classList && e.target.classList.contains("ps-t")) e.target.blur();
});
document.addEventListener("mouseover", e => { const c = e.target.closest && e.target.closest(".oc"); if (c) showHov(c); else if (hovId) hideHov(); });
window.addEventListener("scroll", () => { if (hovId) hideHov(); }, true);
$("menuOv").addEventListener("click", e => { if (e.target === $("menuOv")) $("menuOv").classList.remove("open"); });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "cin") document.querySelector('[data-act="cust-ok"]').click(); });

/* ---------- Firebase ----------
   Bu sayfa YAZAR: kale_siparis_v1
   Bu sayfa sadece OKUR: kale_dokuma_live_v2 (makineler), kale_colors_v2 (ek renkler) */
function setSync(on, t) { $("sync").classList.toggle("on", on); $("sync").textContent = t; }
function authMsg(e) {
  const c = (e && e.code) || "";
  if (c === "auth/network-request-failed") return "Bağlantı yok. İnterneti kontrol edin.";
  if (c === "auth/too-many-requests") return "Çok fazla deneme. Biraz bekleyip tekrar deneyin.";
  if (c === "auth/user-disabled") return "Bu hesap devre dışı.";
  if (c === "auth/invalid-email") return "E-posta adresi geçersiz.";
  return "E-posta veya şifre hatalı.";
}

let dataStarted = false;
function showLogin(msg) {
  $("lock").style.display = "flex";
  const e = $("loginErr"); e.textContent = msg || ""; e.style.display = msg ? "block" : "none";
  $("loginBtn").disabled = false;
}
function signOut() {
  const done = () => { try { localStorage.removeItem("kale_dokuma_local_v3"); localStorage.removeItem("kale_customers_list_v3"); localStorage.removeItem(OKEY); } catch {} location.reload(); };
  if (typeof firebase !== "undefined" && firebase.apps.length) firebase.auth().signOut().then(done, done); else done();
}
const denied = e => { if (e && (e.code === "PERMISSION_DENIED" || /permission/i.test(e.message || ""))) { toast("Bu hesabın yetkisi yok"); setTimeout(signOut, 1800); } };

function initFb() {
  $("loginForm").addEventListener("submit", ev => {
    ev.preventDefault();
    if (typeof firebase === "undefined" || !firebase.apps.length) return showLogin("Bağlantı kurulamadı. İnterneti kontrol edip sayfayı yenileyin.");
    $("loginBtn").disabled = true;
    firebase.auth().signInWithEmailAndPassword($("loginEmail").value.trim(), $("loginPass").value)
      .then(() => { $("loginPass").value = ""; })
      .catch(e => showLogin(authMsg(e)));
  });
  $("outBtn").onclick = signOut;
  if (typeof firebase === "undefined") { setSync(false, "Bağlantı yok"); return showLogin("Firebase yüklenemedi. İnterneti kontrol edip sayfayı yenileyin."); }
  try {
    firebase.initializeApp({
      apiKey: "AIzaSyBWWp1Le6f3y__f7WWoFVvYw9MwdHwFYjc",
      authDomain: "fabrika-e9b49.firebaseapp.com",
      databaseURL: "https://fabrika-e9b49-default-rtdb.firebaseio.com",
      projectId: "fabrika-e9b49",
      storageBucket: "fabrika-e9b49.firebasestorage.app",
      messagingSenderId: "208016312960",
      appId: "1:208016312960:web:db8531b655252e19ecf465"
    });
    firebase.auth().onAuthStateChanged(user => {
      if (user) { $("lock").style.display = "none"; startData(); }
      else if (!dataStarted) showLogin();
      else location.reload();
    });
  } catch { setSync(false, "Bağlantı yok"); showLogin("Firebase başlatılamadı."); }
}

function startData() {
  if (dataStarted) return; dataStarted = true;
  const db = firebase.database();
  ordRef = db.ref("kale_siparis_v1/orders");
  ordRef.on("value", s => {
    const remote = Object.values(s.val() || {}).map(normOrder);
    if (firstOrd) {
      firstOrd = false;
      const have = new Set(remote.map(o => o.id)), localOnly = orders.filter(o => !have.has(o.id));
      orders = [...remote, ...localOnly];
      const sig = o => JSON.stringify(o.lines.map(l => [l.ok, l.pn, l.full, Object.keys(l.mt || {}).sort().map(k => [k, l.mt[k]])]));
      orders.forEach(o => { const b = sig(o); prep(o); if (localOnly.includes(o) || sig(o) !== b) pushOrder(o); });
    } else orders = remote;
    cache();
    if (S.order?.saved && !S.dirty) {
      const fnd = orders.find(o => o.id === S.order.id);
      if (fnd) S.order = clone(fnd); else { S.order = null; if (["order","res","color","prod"].includes(S.view)) S.view = "home"; }
    }
    if (S.view === "home" && $("olist")) drawOrders(); else if (["home","order","res","report","today"].includes(S.view)) render(true);
    refreshSheet();
  }, e => { toast("Siparişler Firebase'den okunamadı"); denied(e); });
  db.ref("kale_dokuma_live_v2").on("value", s => {
    const r = s.val() || {};
    ids.forEach(id => { if (r[id]) { rawColors[id] = r[id].colors; looms[id] = norm(r[id], id); } });
    setSync(true, "Canlı veri ✓");
    if (S.view === "res" || S.view === "report") render(true); else drawChips();
  }, e => { setSync(false, "Yerel veri"); denied(e); });
  db.ref("kale_colors_v2").on("value", s => {
    const v = s.val(); if (v === null) return;
    applyExtraColors(v.list);
    ids.forEach(id => { if (rawColors[id]) looms[id].colors = norm({ ...looms[id], colors: rawColors[id] }, id).colors; });
    if (["color", "res", "order"].includes(S.view)) render(true); else drawChips();
  }, denied);
  notesRef = db.ref("kale_siparis_v1/customer_notes");
  notesRef.on("value", s => { custNotes = s.val() || {}; try { localStorage.setItem(CNOTE_CACHE, JSON.stringify(custNotes)); } catch {} drawOrders(); refreshSheet(); }, denied);
  pricesRef = db.ref("kale_siparis_v1/customer_prices");
  pricesRef.on("value", s => { custPrices = s.val() || {}; try { localStorage.setItem(CPRICE_CACHE, JSON.stringify(custPrices)); } catch {} refreshSheet(); }, denied);
  custRef = db.ref("kale_customers_pool_v2");
  custRef.on("value", s => {
    const v = s.val(); customers = v ? Object.values(v).filter(Boolean) : []; if (S.view === "custmgr") render(true); else drawChips();
  }, denied);
}
render(); initFb();
</script>
