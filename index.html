<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>KALE DOKUMA TAKİP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--page:#061314;--bg:#0d1014;--card:#171b22;--card2:#1e232c;--bd:#2a313c;--tx:#f3efe6;--mu:#9aa3b0;--ac:#f0c674;--ac-d:#1a1405;--run:#34d399;--stop:#f87171;--mnt:#c4a3ff;--yarn:#ff9a4d;--ff:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--ff)}
html,body{width:100%;overflow-x:hidden;background:var(--page);color:var(--tx);padding-bottom:40px;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{background:rgba(13,16,20,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding:12px 10px;position:sticky;top:0;z-index:50;display:flex;flex-direction:column;gap:10px}
.top-bar,.top-actions{display:flex;align-items:center}
.top-bar{justify-content:space-between;flex-wrap:wrap;gap:8px}
.top-actions{gap:8px}
h1{font-size:1.05rem;font-weight:800;letter-spacing:.01em}
.pdf-btn{background:var(--card2);color:var(--tx);border:1px solid var(--bd);padding:6px 11px;border-radius:9px;font-size:.78rem;font-weight:700;cursor:pointer}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;color:var(--run);background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.28);padding:4px 9px;border-radius:999px}
.sync.off{color:var(--yarn);background:rgba(255,154,77,.12);border-color:rgba(255,154,77,.3)}
.pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:p 1.5s infinite}
@keyframes p{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.branch-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.branch-btn,.filter-btn{background:var(--card);border:1px solid var(--bd);color:var(--mu);border-radius:8px;cursor:pointer;white-space:nowrap}
.branch-btn{padding:8px 1px;font-size:.72rem;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.filter-btn{padding:7px 10px;font-size:.74rem;font-weight:600}
.branch-btn.active,.filter-btn.active{background:var(--ac);color:var(--ac-d);border-color:var(--ac);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:7px 2px;text-align:center}
.stat b{display:block;font-size:1.2rem;font-weight:800;line-height:1.2}
.stat span{font-size:.66rem;color:var(--mu);font-weight:600}
.controls{display:flex;gap:5px;overflow-x:auto}
.search{flex:1;min-width:120px;background:var(--card);border:1px solid var(--bd);color:var(--tx);padding:9px 11px;border-radius:8px;font-size:.84rem}
.search::placeholder{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px;width:100%}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:18px;max-width:1400px;margin:0 auto}}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:30px 0;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;display:flex;flex-direction:column;cursor:pointer;min-width:0;overflow:hidden;text-align:left;color:inherit;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.card:active{transform:scale(.97)}
.stripe{height:15px;flex-shrink:0}
.xtag{text-align:center;font-size:.74rem;font-weight:800;color:var(--ac);background:rgba(240,198,116,.12);border:1px solid rgba(240,198,116,.35);border-radius:6px;padding:3px 6px}
.stripe.bot{height:5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22);margin-top:auto}
.body{padding:9px;display:flex;flex-direction:column;gap:7px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:5px;min-width:0}
.id{font-weight:800;font-size:1.12rem;color:var(--ac)}
.badge{flex:1;min-width:0;text-align:center;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:4px 6px;font-size:.92rem;font-weight:800;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w{font-size:.68rem;font-weight:800;padding:3px 6px;border-radius:5px;color:#fff}
.w140{background:#2f7fb5}.w160{background:#7c5cc9}.w200{background:#c27a1e}
.st{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.box{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.main{display:flex;align-items:center;gap:8px;background:var(--card2);padding:5px 7px;border-radius:6px;min-width:0}
.dot{border-radius:50%;border:1px solid rgba(255,255,255,.45);flex-shrink:0}
.main .dot{width:20px;height:20px;border-width:1.5px}
.meta{display:flex;flex-direction:column;min-width:0}
.meta small{font-size:.58rem;color:var(--mu);font-weight:700;letter-spacing:.02em}
.meta span{font-size:.86rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.sub{background:var(--card2);border-radius:6px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.sub .dot{width:13px;height:13px}
.sub span{font-size:.62rem;font-weight:700;color:#d6dae0;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cust,.warp{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 7px;display:flex;flex-direction:column;gap:4px}
.row{display:flex;justify-content:space-between;gap:6px;font-size:.8rem;min-width:0}
.row small{color:var(--mu);font-size:.62rem;font-weight:700;flex-shrink:0;align-self:center}
.row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;color:#d6dae0}
.row .cur{color:var(--run);font-weight:800}
.warp small{font-size:.62rem;font-weight:700;color:var(--mu)}
.warps{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.wi{display:flex;align-items:center;gap:5px;min-width:0;font-size:.76rem;font-weight:700}
.wi .dot{width:12px;height:12px}
.wi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.overlay{position:fixed;inset:0;background:rgba(5,7,10,.86);backdrop-filter:blur(6px);z-index:100;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.overlay.mid{align-items:center}
.sheet{background:var(--card);width:100%;max-width:550px;border-radius:18px 18px 0 0;padding:18px;max-height:90vh;overflow-y:auto;border:1px solid var(--bd)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--bd);gap:8px}
.sheet-head h2{font-size:1.05rem;color:var(--tx);text-align:center;font-weight:800}
.b-cancel{background:rgba(248,113,113,.12);color:var(--stop);border:1px solid rgba(248,113,113,.3);padding:8px 13px;border-radius:9px;font-size:.84rem;font-weight:700;cursor:pointer}
.b-save{background:var(--ac);color:var(--ac-d);border:1px solid var(--ac);padding:8px 17px;border-radius:9px;font-size:.88rem;font-weight:800;cursor:pointer}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:.8rem;color:var(--mu);margin-bottom:6px;font-weight:700}
.inp{width:100%;background:var(--bg);border:1px solid var(--bd);padding:10px 12px;border-radius:8px;color:var(--tx);font-size:.9rem}
.stsel{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.sbtn{padding:10px;border-radius:8px;border:2px solid transparent;background:var(--bg);color:var(--tx);font-size:.84rem;font-weight:700;cursor:pointer}
.xbtn{padding:10px;border-radius:8px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:.84rem;font-weight:700;cursor:pointer}
.xbtn.on{border-color:var(--ac);background:rgba(240,198,116,.14);color:var(--ac)}
.sbtn.sel-running{border-color:var(--run);background:rgba(52,211,153,.14)}
.sbtn.sel-stopped{border-color:var(--stop);background:rgba(248,113,113,.14)}
.sbtn.sel-yarn{border-color:var(--yarn);background:rgba(255,154,77,.14)}
.sbtn.sel-maint{border-color:var(--mnt);background:rgba(196,163,255,.14)}
.csel{background:var(--bg);padding:6px 8px;border-radius:8px;border:1px solid var(--bd);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.csel .ind{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.4);flex-shrink:0}
.csel i{font-style:normal;font-weight:700;color:var(--mu);font-size:.8rem;min-width:38px}
.csel .inp{border:0;padding:7px 4px}
.subs.two{grid-template-columns:repeat(2,1fr)}
.wing-h{font-size:.84rem;font-weight:800;color:var(--ac);margin:10px 0 6px}
.col-add{display:flex;gap:7px;margin-bottom:12px;align-items:center}
.col-add .inp{flex:1}
.col-add input[type=color]{width:46px;height:42px;padding:2px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);cursor:pointer;flex-shrink:0}
.col-item{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;cursor:pointer}
.col-item.open{border-color:var(--ac)}
.col-item b{flex:1;min-width:0;font-size:.9rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-item small{color:var(--mu);font-size:.7rem;font-weight:600;flex-shrink:0}
.col-item button.del{background:var(--card2);border:1px solid rgba(248,113,113,.3);color:var(--stop);border-radius:7px;padding:5px 9px;cursor:pointer;font-size:.85rem}
.col-det{background:var(--card2);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;margin:-2px 0 4px;display:flex;flex-direction:column;gap:7px}
.col-det .lab{font-size:.72rem;font-weight:800;color:var(--mu)}
.col-det .chips{display:flex;flex-wrap:wrap;gap:5px}
.lchip{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:3px 8px;font-size:.8rem;font-weight:800}
.lchip i{font-style:normal;font-weight:600;color:var(--mu);font-size:.68rem}
.lchip.m{border-color:var(--ac);color:var(--ac)}
.cm-add{display:flex;gap:7px;margin-bottom:12px}
.cm-add .inp{flex:1}
.cm-list{display:flex;flex-direction:column;gap:6px}
.cm-item{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
.cm-item b{flex:1;min-width:0;font-size:.92rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm-item small{color:var(--mu);font-size:.7rem;font-weight:600;flex-shrink:0}
.cm-item button{background:var(--card2);border:1px solid var(--bd);color:var(--tx);border-radius:7px;padding:6px 10px;cursor:pointer;font-size:.85rem}
.cm-item button.del{color:var(--stop);border-color:rgba(248,113,113,.3)}
.pin{background:var(--card);width:90%;max-width:320px;border-radius:16px;padding:22px;text-align:center;border:1px solid var(--ac)}
.pin input{width:100%;background:var(--bg);border:2px solid var(--bd);padding:12px;border-radius:10px;color:var(--tx);font-size:1rem;text-align:left;font-weight:600;margin:6px 0;font-family:inherit}
#login{z-index:400;background:var(--page)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--ac);padding:9px 16px;border-radius:9px;font-size:.84rem;font-weight:600;z-index:200;display:none}
.obtn{width:100%;background:var(--card2);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:8px;font-size:.78rem;font-weight:700;cursor:pointer}
.oi{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;margin-bottom:7px;display:flex;flex-direction:column;gap:4px}
.oh{display:flex;align-items:center;gap:7px}
.oh b{flex:1;font-size:.92rem;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oi small{color:var(--mu);font-size:.76rem;font-weight:600}
.oi .os{font-size:.8rem;font-weight:700}
.oi .ok{color:var(--run)}.oi .mid{color:var(--yarn)}.oi .bad{color:var(--mu)}.oi .warn{color:var(--stop)}
.osec{font-size:.8rem;font-weight:800;color:var(--ac);margin:12px 0 7px}
#printSection{display:none}
@media print{
body *{visibility:hidden}
#printSection,#printSection *{visibility:visible}
#printSection{display:block!important;position:absolute;left:0;top:0;width:100%;background:#fff!important;color:#000!important;padding:15px}
.pt{width:100%;border-collapse:collapse;margin-top:12px}
.pt th,.pt td{border:1px solid #444;padding:6px 8px;text-align:left;font-size:9.5pt}
.pt th{background:#f1f5f9}
.pd{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;border:1px solid #888}
}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

<header>
  <div class="top-bar">
    <h1>🧵 KALE DOKUMA TAKİP</h1>
    <div class="top-actions">
      <button type="button" class="pdf-btn" id="custBtn">👥 Müşteriler</button>
      <button type="button" class="pdf-btn" id="colBtn">🎨 Renkler</button>
      <button type="button" class="pdf-btn" id="pdfBtn">🖨️ PDF / Yazdır</button>
      <button type="button" class="pdf-btn" id="outBtn" title="Çıkış">🚪</button>
      <div class="sync off" id="sync"><span class="pulse"></span><span id="syncText">Bağlanıyor</span></div>
    </div>
  </div>
  <div class="branch-bar" id="branchBar"></div>
  <div class="stats">
    <div class="stat"><b id="sRun" style="color:var(--run)">0</b><span>Çalışıyor</span></div>
    <div class="stat"><b id="sStop" style="color:var(--stop)">0</b><span>Duruş</span></div>
    <div class="stat"><b id="sYarn" style="color:var(--yarn)">0</b><span>İplik Yok</span></div>
    <div class="stat"><b id="sMnt" style="color:var(--mnt)">0</b><span>Bakımda</span></div>
  </div>
  <div class="controls">
    <input type="search" id="search" class="search" placeholder="Müşteri veya Makine Ara..." aria-label="Ara">
    <button class="filter-btn active" data-filter="all">Tüm Boylar</button>
    <button class="filter-btn" data-filter="140">140 cm</button>
    <button class="filter-btn" data-filter="160">160 cm</button>
    <button class="filter-btn" data-filter="200">200 cm</button>
  </div>
</header>

<main class="grid" id="grid"></main>
<div id="printSection"></div>
<div class="toast" id="toast"></div>

<div class="overlay mid open" id="login">
  <form class="pin" id="loginForm" autocomplete="on">
    <h3 style="font-size:1rem;margin-bottom:4px">🔒 Giriş</h3>
    <p style="color:var(--mu);font-size:.78rem;margin-bottom:8px">Devam etmek için hesabınızla giriş yapın.</p>
    <input type="email" id="loginEmail" placeholder="E-posta" autocomplete="username" inputmode="email" required>
    <input type="password" id="loginPass" placeholder="Şifre" autocomplete="current-password" required>
    <div id="loginErr" style="color:var(--stop);font-size:.78rem;display:none;margin:4px 0 8px"></div>
    <button type="submit" class="b-save" style="width:100%;margin-top:8px" id="loginBtn">Giriş</button>
  </form>
</div>

<div class="overlay" id="editModal">
  <div class="sheet">
    <div class="sheet-head">
      <button type="button" class="b-cancel" id="closeBtn">✕ Kapat</button>
      <h2 id="mTitle">Makine Ayarı</h2>
      <button type="button" class="b-save" id="saveBtn">✓ Kaydet</button>
    </div>
    <div class="fg"><label>Makine Durumu</label>
      <div class="stsel">
        <button type="button" class="sbtn" data-val="running">Çalışıyor</button>
        <button type="button" class="sbtn" data-val="yarn">İplik Yok</button>
        <button type="button" class="sbtn" data-val="stopped">Durduruldu</button>
        <button type="button" class="sbtn" data-val="maint">Arıza / Bakım</button>
      </div>
    </div>
    <div class="fg"><label for="fCur">Mevcut Müşteri</label><select class="inp" id="fCur"></select></div>
    <div class="fg"><label for="fNext">Gelecek Müşteri</label><select class="inp" id="fNext"></select></div>
    <div class="fg"><label for="fWidth">En (Genişlik)</label>
      <select id="fWidth" class="inp"><option value="140">140 cm</option><option value="160">160 cm</option><option value="200">200 cm (2 Metre)</option></select>
    </div>
    <div class="fg"><label>Özellik</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <button type="button" class="xbtn" id="xSpingel" data-x="spingel">⬜ ŞPİNGEL</button>
        <button type="button" class="xbtn" id="xSimli" data-x="simli">⬜ SİMLİ</button>
      </div>
    </div>
    <div class="fg"><label id="colLabel">Ana Renk (1) ve Alt Renkler (2, 3, 4)</label><div id="colRows"></div></div>
    <div class="fg"><label>Çözgü Renkleri</label><div id="warpRows" style="display:grid;grid-template-columns:1fr 1fr;gap:6px"></div></div>
  </div>
</div>

<div class="overlay" id="custModal">
  <div class="sheet">
    <div class="sheet-head">
      <button type="button" class="b-cancel" id="custClose">✕ Kapat</button>
      <h2>Müşteri Yönetimi</h2>
      <span style="width:70px"></span>
    </div>
    <div class="cm-add">
      <input class="inp" id="cmNew" placeholder="Yeni müşteri adı..." maxlength="60" autocomplete="off">
      <button type="button" class="b-save" id="cmAdd">Ekle</button>
    </div>
    <div class="cm-list" id="cmList"></div>
  </div>
</div>

<div class="overlay" id="colModal">
  <div class="sheet">
    <div class="sheet-head">
      <button type="button" class="b-cancel" id="colClose">✕ Kapat</button>
      <h2>Renkler</h2>
      <span style="width:70px"></span>
    </div>
    <div class="col-add">
      <input class="inp" id="colName" placeholder="Yeni renk adı..." maxlength="24" autocomplete="off">
      <input type="color" id="colHex" value="#808080" aria-label="Renk seç">
      <button type="button" class="b-save" id="colAdd">Ekle</button>
    </div>
    <p style="color:var(--mu);font-size:.74rem;margin-bottom:10px">Bir renge dokunun: hangi makinelerde ana / alt renk olduğunu görün.</p>
    <div class="cm-list" id="colList"></div>
  </div>
</div>

<div class="overlay" id="ordModal">
  <div class="sheet">
    <div class="sheet-head">
      <button type="button" class="b-cancel" id="ordClose">✕ Kapat</button>
      <h2 id="ordTitle">Siparişler</h2>
      <span style="width:70px"></span>
    </div>
    <div id="ordBody"></div>
  </div>
</div>

<script>
/* ============================================================
   KALE DOKUMA - MAKINE TAKIP SAYFASI (index.html)  -- BELGE / DOCUMENTATION
   Ayrintili belge icin README.md dosyasina bakin.

   NE YAPAR: Fabrikadaki 34 tezgahin (R1-16, A1-4, Y1-8, K1-6) canli durumunu
   gosterir ve duzenletir: durum, mevcut/gelecek musteri, ana+alt renkler, cozgu.
   Siparis sayfasi (siparis.html) bu verileri OKUR; bu sayfa siparisleri sadece OKUR.

   VERI (Firebase Realtime Database, proje fabrika-e9b49):
     YAZAR : kale_dokuma_live_v2/<makineId>   (tezgahlar)
             kale_customers_pool_v2           (musteri havuzu)
     YAZAR : kale_colors_v1                   (sonradan eklenen renkler [{name,hex}]; siparis.html okur)
     OKUR  : kale_siparis_v1/orders           (siparis sayfasinin yazdigi siparisler)
   Bu ayrim sadece kodda uygulanan bir kuraldir (veritabani kurallari yazmayi
   UID bazinda kisitlar ama yol bazinda degil). Yeni kod bu ayrima uymali.

   TEZGAH MODELI (normalize/buildLoom): {id, branch, num, width(140|160|200), status,
     currentCustomer, nextCustomer, colors[], warps[2], extra("spingel"|"simli"|""), lastModified}
     - 140 cm tezgahlar IKI KANATLI: colors[0..2]=1. kanat (ana+2 alt),
       colors[3..5]=2. kanat. 160/200 cm tezgahlarda 4 renk (colors[0]=ana renk).
     - "0" = iplik yok / renk yok.

const arr = x => Array.isArray(x) ? x : Object.values(x || {});

const lc = s => s.toLocaleLowerCase("tr");
/* Türkçe alfabe sıralaması - tarayıcının dil desteğine BAĞLI DEĞİL (a b c ç d e f g ğ h ı i j k l m n o ö p q r s ş t u ü v w x y z) */
const TR_IDX = {}; "abcçdefgğhıijklmnoöpqrsştuüvwxyz".split("").forEach((c, i) => TR_IDX[c] = i);
const trKey = n => n.replace(/İ/g, "i").replace(/I/g, "ı").toLowerCase();

  });
  customers = customers.filter(c => c !== old && (!neu || lc(c) !== lc(neu)));
  if (neu) customers.push(neu);
  store.set(CACHE_KEY, looms); saveCustomers(); refresh(); updateCustList();
}
function renameCustomer(old) {
  const raw = prompt("Müşteri adı:", old); if (raw === null) return;
  const name = raw.trim().replace(/\s+/g, " ");
  if (!name || name === old) return;
  if (allCustomers().some(n => n !== old && lc(n) === lc(name))) return toast("Bu isimde müşteri zaten var");
  changeCustomer(old, name); toast("Güncellendi ✓");
}
function deleteCustomer(n) {
  const u = usage(n);
  if (!confirm(`"${n}" silinsin mi?` + (u ? `\nBu müşteri ${u} makinede kayıtlı; oralardan da kaldırılacak.` : ""))) return;
  changeCustomer(n, ""); toast("Silindi");
}

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 2200);
}

/* ---------- Build static UI ---------- */
function initUi() {
  $("branchBar").innerHTML =
    `<button class="branch-btn active" data-branch="all">Tümü (${TOTAL})</button>` +
    Object.entries(BRANCHES).map(([k, b]) => `<button class="branch-btn" data-branch="${k}">${esc(b.name)} (${b.count})</button>`).join("");

  const opts = o => Object.keys(o).map(n => `<option value="${esc(n)}">${n === "0" ? "0 (İplik Yok)" : esc(n)}</option>`).join("");
  $("warpRows").innerHTML = [1,2].map(i => `
    <div class="csel"><i>${i}:</i><span class="ind" id="wd${i}"></span>
    <select id="ws${i}" class="inp" data-i="${i}" aria-label="Çözgü ${i}">${opts(WARPS)}</select></div>`).join("");
  document.querySelectorAll("[id^=ws]").forEach(s => s.onchange = () => $("wd" + s.dataset.i).style.background = warpHex(s.value));

  $("branchBar").onclick = e => {
    const b = e.target.closest(".branch-btn"); if (!b) return;
    document.querySelectorAll(".branch-btn").forEach(x => x.classList.toggle("active", x === b));
    branch = b.dataset.branch; refresh();
  };
  document.querySelectorAll(".filter-btn").forEach(btn => btn.onclick = () => {
    document.querySelectorAll(".filter-btn").forEach(x => x.classList.toggle("active", x === btn));
    widthFilter = btn.dataset.filter; renderLooms();
  });
  let timer;
  $("search").oninput = e => { clearTimeout(timer); timer = setTimeout(() => { query = e.target.value.trim(); renderLooms(); }, 200); };
  document.querySelectorAll(".sbtn").forEach(b => b.onclick = () => setStatus(b.dataset.val));
  $("fWidth").onchange = () => buildColorRows($("fWidth").value, readColors());
  document.querySelectorAll(".xbtn").forEach(b => b.onclick = () => setExtra(selectedExtra === b.dataset.x ? "" : b.dataset.x));
  [$("fCur"), $("fNext")].forEach(sel => sel.onchange = () => {
    if (sel.value !== "__new__") { sel.dataset.prev = sel.value; return; }
    const n = addCustomer(prompt("Yeni müşteri adı:"));
    fillCustSelect(sel, n || sel.dataset.prev || "");
  });
  $("custBtn").onclick = () => openLoom("__cust__");
  $("custClose").onclick = () => $("custModal").classList.remove("open");
  $("colBtn").onclick = () => { colSel = null; $("colName").value = ""; renderColManager(); $("colModal").classList.add("open"); };
  $("colClose").onclick = () => $("colModal").classList.remove("open");
  $("colAdd").onclick = addColor;
  $("colName").addEventListener("keydown", e => { if (e.key === "Enter") addColor(); });
  $("colList").addEventListener("click", e => {
    const d = e.target.closest('[data-a="del"]');
    if (d) { delColor(d.dataset.n); return; }
    const it = e.target.closest(".col-item"); if (!it) return;
    colSel = colSel === it.dataset.n ? null : it.dataset.n; renderColManager();
  });
  $("cmAdd").onclick = () => { const n = addCustomer($("cmNew").value); if (n) { $("cmNew").value = ""; renderCustManager(); toast("Kaydedildi ✓"); } };
  $("cmNew").addEventListener("keydown", e => { if (e.key === "Enter") $("cmAdd").onclick(); });
  $("cmList").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    const n = allCustomers()[+b.dataset.i]; if (!n) return;
    if (b.dataset.a === "ren") renameCustomer(n); else deleteCustomer(n);
  };
  $("closeBtn").onclick = () => $("editModal").classList.remove("open");
  $("saveBtn").onclick = saveLoom;
  $("ordClose").onclick = () => $("ordModal").classList.remove("open");
  $("pdfBtn").onclick = printReport;
  document.addEventListener("keydown", e => { if (e.key === "Escape") { $("editModal").classList.remove("open"); $("custModal").classList.remove("open"); $("colModal").classList.remove("open"); $("ordModal").classList.remove("open"); } });
}

/* ---------- Giriş ---------- */
const enter = id => id === "__cust__" ? openCust() : openModal(id);
const openLoom = id => enter(id);
/* ---------- Edit modal ---------- */
function setStatus(st) {
  selectedStatus = st;
  document.querySelectorAll(".sbtn").forEach(b => b.className = "sbtn" + (b.dataset.val === st ? " sel-" + st : ""));
}
function buildColorRows(width, vals = []) {
  const wide = Number(width) === 140, n = colorCount(width);
  const lab = wide ? ["Ana","Alt 1","Alt 2","Ana","Alt 1","Alt 2"] : ["1","2","3","4"];
  $("colLabel").textContent = wide ? "Renkler (her kanatta 1 ana + 2 alt renk)" : "Ana Renk (1) ve Alt Renkler (2, 3, 4)";
  let h = "";
  for (let i = 1; i <= n; i++) {
    if (wide && (i === 1 || i === 4)) h += `<div class="wing-h">${i === 1 ? "1. Kanat" : "2. Kanat"}</div>`;
    h += `<div class="csel"><i>${lab[i - 1]}:</i><span class="ind" id="cd${i}"></span><select id="cs${i}" class="inp" aria-label="Renk ${i}">${optsHtml(COLORS)}</select></div>`;
  }
  $("colRows").innerHTML = h;
  for (let i = 1; i <= n; i++) {
    const sel = $("cs" + i);
    sel.value = vals[i - 1] in COLORS ? vals[i - 1] : "0";
    $("cd" + i).style.background = hexOf(sel.value);
    sel.onchange = () => $("cd" + i).style.background = hexOf(sel.value);
  }
}
const readColors = () => { const a = []; for (let i = 1; $("cs" + i); i++) a.push($("cs" + i).value); return a; };
function openModal(id) {
  const l = looms[id]; if (!l) return;
  selectedId = id;
  $("mTitle").textContent = `${l.id} Ayarları`;
  fillCustSelect($("fCur"), l.currentCustomer || ""); fillCustSelect($("fNext"), l.nextCustomer || "");
  $("fWidth").value = l.width; buildColorRows(l.width, l.colors);
  l.warps.forEach((w, i) => { $("ws" + (i + 1)).value = w; $("wd" + (i + 1)).style.background = warpHex(w); });
  setStatus(l.status || "running");
  setExtra(l.extra);
  $("editModal").classList.add("open");
}
function saveLoom() {
  if (!selectedId) return;
  const cur = $("fCur").value.trim(), nxt = $("fNext").value.trim();
  const data = {
    ...looms[selectedId], currentCustomer: cur, nextCustomer: nxt,
    width: parseInt($("fWidth").value, 10), status: selectedStatus,
    colors: readColors(),
    warps: [1,2].map(i => $("ws" + i).value),
    extra: selectedExtra,
    lastModified: Date.now()
  };
  looms[selectedId] = data; rawColors[selectedId] = data.colors; store.set(CACHE_KEY, looms); refresh();
  $("editModal").classList.remove("open");
  if (loomsRef) loomsRef.child(selectedId).set(data).then(() => toast("Kaydedildi ✓")).catch(() => toast("Kaydedilemedi: yetkiniz yok veya bağlantı yok"));
  else toast("Yerel olarak kaydedildi");
}

/* ---------- Print ---------- */
function printReport() {
  const now = new Date();
  const date = now.toLocaleDateString("tr-TR") + " " + now.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
  const title = branch === "all" ? `Tüm Fabrika (${TOTAL} Makine)` : `${BRANCHES[branch].name} Şubesi`;
  const dotted = (hex, txt) => `<span class="pd" style="background:${hex}"></span>${esc(txt)}`;
  const rows = sorted().filter(l => branch === "all" || l.branch === branch).map(l => {
    const C = l.colors, w140 = l.width === 140;
    const item = (c, lab) => c === "0" ? `<span style="color:#888">${lab}: Yok (0)</span>` : dotted(hexOf(c), `${lab}: ${c}`);
    const subs = (w140 ? [["K1/1",1],["K1/2",2],["K2/1",4],["K2/2",5]] : [["2",1],["3",2],["4",3]]).map(([lab, i]) => `<div>${item(C[i], lab)}</div>`).join("");
    const mains = (w140 ? [["K1",0],["K2",3]] : [["",0]]).map(([lab, i]) => `<div>${dotted(hexOf(C[i]), (lab ? lab + ": " : "") + (C[i] === "0" ? "0 (Yok)" : C[i]))}</div>`).join("");
    return `<tr>
      <td style="font-weight:700;text-align:center">${esc(l.id)}</td>
      <td style="text-align:center">${esc(BRANCHES[l.branch].name)}</td>
      <td style="text-align:center">${esc(l.width)} cm</td>
      <td style="font-weight:700">${esc(l.currentCustomer || "-")}</td>
      <td>${mains}</td>
      <td style="font-size:8.5pt">${subs}</td>
      <td style="font-size:8.5pt">1: ${esc(l.warps[0])}<br>2: ${esc(l.warps[1])}</td>
      <td style="color:#444">${esc(l.nextCustomer || "-")}</td></tr>`;
  }).join("");
  $("printSection").innerHTML = `
    <div style="display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:8px">
      <div><h1 style="font-size:15pt">🧵 KALE DOKUMA TAKİP - RAPORU</h1><p style="font-size:9.5pt;color:#444">Bölüm: <strong>${esc(title)}</strong></p></div>
      <div style="font-size:8.5pt;color:#444">Tarih: ${esc(date)}</div></div>
    <table class="pt"><thead><tr><th>Makine</th><th>Şube</th><th>En</th><th>Şu Anki Müşteri</th><th>Ana Renk (1)</th><th>Alt Renkler</th><th>Çözgü</th><th>Gelecek Müşteri</th></tr></thead><tbody>${rows}</tbody></table>`;
  window.print();
}

/* ---------- Firebase ----------
   Bu sayfa YAZAR: kale_dokuma_live_v2 (makineler), kale_customers_pool_v2 (müşteriler)
   Bu sayfa sadece OKUR: kale_siparis_v1 (siparişler) */
function setSync(ok, text) { $("sync").classList.toggle("off", !ok); $("syncText").textContent = text; }

function authMsg(e) {
  const c = (e && e.code) || "";
  if (c === "auth/network-request-failed") return "Bağlantı yok. İnterneti kontrol edin.";
  if (c === "auth/too-many-requests") return "Çok fazla deneme. Biraz bekleyip tekrar deneyin.";
  if (c === "auth/user-disabled") return "Bu hesap devre dışı.";
  if (c === "auth/invalid-email") return "E-posta adresi geçersiz.";
  return "E-posta veya şifre hatalı.";
}

let dataStarted = false;
function showLogin(msg) {
  $("login").classList.add("open");
  const e = $("loginErr"); e.textContent = msg || ""; e.style.display = msg ? "block" : "none";
  $("loginBtn").disabled = false;
}
function signOut() {
  const done = () => { try { localStorage.removeItem(CACHE_KEY); localStorage.removeItem(CUST_KEY); } catch {} location.reload(); };
  if (typeof firebase !== "undefined" && firebase.apps.length) firebase.auth().signOut().then(done, done); else done();
}
const denied = e => { if (e && (e.code === "PERMISSION_DENIED" || /permission/i.test(e.message || ""))) { toast("Bu hesabın yetkisi yok"); setTimeout(signOut, 1800); } };

function initFirebase() {
  $("loginForm").addEventListener("submit", ev => {
    ev.preventDefault();
    if (typeof firebase === "undefined" || !firebase.apps.length) return showLogin("Bağlantı kurulamadı. İnterneti kontrol edip sayfayı yenileyin.");
    $("loginBtn").disabled = true;
    firebase.auth().signInWithEmailAndPassword($("loginEmail").value.trim(), $("loginPass").value)
      .then(() => { $("loginPass").value = ""; })
      .catch(e => showLogin(authMsg(e)));
  });
  $("outBtn").onclick = signOut;
  if (typeof firebase === "undefined") { setSync(false, "Bağlantı yok"); return showLogin("Firebase yüklenemedi. İnterneti kontrol edip sayfayı yenileyin."); }
  try {
    firebase.initializeApp({
      apiKey: "AIzaSyBWWp1Le6f3y__f7WWoFVvYw9MwdHwFYjc",
      authDomain: "fabrika-e9b49.firebaseapp.com",
      databaseURL: "https://fabrika-e9b49-default-rtdb.firebaseio.com",
      projectId: "fabrika-e9b49",
      storageBucket: "fabrika-e9b49.firebasestorage.app",
      messagingSenderId: "208016312960",
      appId: "1:208016312960:web:db8531b655252e19ecf465"
    });
    firebase.auth().onAuthStateChanged(user => {
      if (user) { $("login").classList.remove("open"); startData(); }
      else if (!dataStarted) showLogin();
      else location.reload();
    });
  } catch (e) {
    console.warn("Firebase kapalı:", e); setSync(false, "Bağlantı yok"); showLogin("Firebase başlatılamadı.");
  }
}

function startData() {
  if (dataStarted) return; dataStarted = true;
  const db = firebase.database();
  loomsRef = db.ref("kale_dokuma_live_v2");
  custRef = db.ref("kale_customers_pool_v2");
  colorsRef = db.ref("kale_colors_v1");
  /* Ek renkler MAKİNELERDEN ÖNCE yüklenir; yoksa ek renkli makineler "0" sanılır */
  const colorsReady = colorsRef.once("value").then(sn => applyCustomColors(sn.val())).catch(() => {});
  ordRef = db.ref("kale_siparis_v1/orders");
  ordRef.on("value", s => { ordersData = s.val() || {}; renderLooms(); if ($("ordModal").classList.contains("open")) renderOrd(); }, denied);

  /* Bağlantı durumu */
  db.ref(".info/connected").on("value", s => setSync(!!s.val(), s.val() ? "Canlı Bağlantı" : "Çevrimdışı"));

  /* İlk yükleme: eksik makineleri tamamla (migrasyon), sonra tek tek değişiklikleri dinle */
  colorsReady.then(() => loomsRef.once("value")).then(snap => {
    const remote = snap.val() || {};
    allIds().forEach(id => {
      if (remote[id]) { rawColors[id] = remote[id].colors; looms[id] = normalize(remote[id], id); }
      else loomsRef.child(id).set(looms[id]).catch(() => {});
    });
    store.set(CACHE_KEY, looms); refresh();
    const onLoom = s => {
      if (!s.key || !(s.key in looms)) return;
      rawColors[s.key] = s.val()?.colors; looms[s.key] = normalize(s.val(), s.key);
      store.set(CACHE_KEY, looms); refresh();
    };
    loomsRef.on("child_changed", onLoom);
    loomsRef.on("child_added", onLoom);
    colorsRef.on("value", sn => { applyCustomColors(sn.val()); renormColors(); afterColorsChanged(); }, denied);
  }).catch(e => { setSync(false, "Bağlantı yok"); denied(e); });

  custRef.on("value", s => {
    const v = s.val();
    customers = v ? Object.values(v).filter(Boolean) : []; store.set(CUST_KEY, customers); updateCustList();
  }, denied);
}

initUi(); refresh(); updateCustList(); initFirebase();
</script>
