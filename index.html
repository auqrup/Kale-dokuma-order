<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KALE DOKUMA TAKİP</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #151f32;
      --card-border: #233554;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --status-running: #22c55e;
      --status-stopped: #ef4444;
      --status-maint: #eab308;
      --status-yarn: #f97316;
      --w140: #0284c7;
      --w160: #7c3aed;
      --w200: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    html, body {
      width: 100%;
      overflow-x: hidden;
      background-color: var(--bg);
      color: var(--text-main);
      padding-bottom: 40px;
      -webkit-tap-highlight-color: transparent;
    }

    header {
      background: #0f172a;
      border-bottom: 1px solid var(--card-border);
      padding: 10px 8px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-bar h1 {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #f8fafc;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pdf-btn {
      background: #0284c7;
      color: #fff;
      border: 1px solid #38bdf8;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      background: rgba(34, 197, 94, 0.15);
      color: var(--status-running);
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 3px 8px;
      border-radius: 999px;
    }

    .pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--status-running);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* شريط الأزرار بعد التقسيم لـ 5 أزرار */
    .branch-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .branch-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 1px;
      border-radius: 6px;
      font-size: 0.68rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .branch-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
      font-weight: 700;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .stat-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 5px 2px;
      text-align: center;
    }
    .stat-pill .num { font-size: 0.95rem; font-weight: bold; }
    .stat-pill .lbl { font-size: 0.6rem; color: var(--text-muted); }

    .controls-row {
      display: flex;
      gap: 4px;
      overflow-x: auto;
    }

    .search-input {
      flex: 1;
      min-width: 100px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 7px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      outline: none;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 5px 6px;
      border-radius: 6px;
      font-size: 0.68rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .filter-btn.active {
      background: var(--accent);
      color: #0b1120;
      font-weight: bold;
      border-color: var(--accent);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 8px;
      width: 100%;
      max-width: 100vw;
    }

    @media (min-width: 1024px) {
      .grid-container { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 12px; max-width: 1400px; margin: 0 auto; }
    }

    .loom-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      min-width: 0;
      overflow: hidden;
      transition: transform 0.15s, border-color 0.15s;
    }

    .loom-card:active { transform: scale(0.97); }

    .card-color-stripe {
      width: 100%;
      height: 8px;
      flex-shrink: 0;
    }

    .card-body {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .loom-title {
      font-weight: 800;
      font-size: 1.05rem;
      color: #38bdf8;
      flex-shrink: 0;
    }

    .head-badge {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 5px;
      padding: 3px 6px;
      overflow: hidden;
      min-width: 0;
    }

    .head-badge-text {
      font-size: 0.88rem;
      font-weight: 800;
      color: #38bdf8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      width: 100%;
    }

    .width-tag {
      font-size: 0.65rem;
      font-weight: bold;
      padding: 2px 5px;
      border-radius: 4px;
      color: #fff;
      flex-shrink: 0;
    }
    .w-140 { background: var(--w140); }
    .w-160 { background: var(--w160); }
    .w-200 { background: var(--w200); }

    .color-hierarchy-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 7px;
      padding: 5px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .main-color-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px 6px;
      border-radius: 5px;
      min-width: 0;
    }

    .main-color-dot {
      width: 18px;
      height: 18px;
      min-width: 18px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      flex-shrink: 0;
    }

    .main-color-meta {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .main-color-lbl { font-size: 0.55rem; color: #38bdf8; font-weight: 700; }
    .main-color-name { font-size: 0.78rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

    .sub-colors-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      min-width: 0;
    }

    .sub-color-item {
      background: #0b1120;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 5px;
      padding: 3px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 0;
      overflow: hidden;
    }

    .sub-color-dot {
      width: 12px;
      height: 12px;
      min-width: 12px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.4);
      flex-shrink: 0;
    }

    .sub-color-name {
      font-size: 0.58rem;
      font-weight: 600;
      color: #cbd5e1;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .customers-section {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 5px 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .cust-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      min-width: 0;
    }
    .cust-lbl { color: var(--text-muted); font-size: 0.6rem; font-weight: 700; flex-shrink: 0; }
    .cust-curr { font-weight: 800; color: #4ade80; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 68%; text-align: left; }
    .cust-next { font-weight: 700; color: #cbd5e1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 68%; text-align: left; }

    .warp-section {
      background: rgba(255, 255, 255, 0.03);
      padding: 5px 6px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .warp-header-title {
      font-size: 0.62rem;
      font-weight: 800;
      color: #38bdf8;
    }

    .warp-items-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      min-width: 0;
    }

    .warp-item {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow: hidden;
      min-width: 0;
    }

    .warp-num {
      font-size: 0.7rem;
      font-weight: 800;
      color: #94a3b8;
      flex-shrink: 0;
    }

    .warp-dot {
      width: 11px;
      height: 11px;
      min-width: 11px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.5);
      flex-shrink: 0;
    }

    .warp-text {
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal-sheet {
      background: #1e293b;
      width: 100%;
      max-width: 550px;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      padding: 16px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid #334155;
    }

    .modal-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid #334155;
      gap: 8px;
    }

    .modal-btn-cancel {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-btn-save {
      background: #0284c7;
      color: #fff;
      border: 1px solid #38bdf8;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
    .form-input, .form-select { width: 100%; background: #0f172a; border: 1px solid #334155; padding: 9px 11px; border-radius: 6px; color: #fff; font-size: 0.85rem; outline: none; }

    .status-selector { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .status-opt-btn { padding: 9px; border-radius: 6px; border: 2px solid transparent; background: #0f172a; color: #fff; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
    .status-opt-btn.sel-running { border-color: var(--status-running); background: rgba(34, 197, 94, 0.15); }
    .status-opt-btn.sel-stopped { border-color: var(--status-stopped); background: rgba(239, 68, 68, 0.15); }
    .status-opt-btn.sel-yarn { border-color: var(--status-yarn); background: rgba(249, 115, 22, 0.15); }
    .status-opt-btn.sel-maint { border-color: var(--status-maint); background: rgba(234, 179, 8, 0.15); }

    .color-select-item {
      background: #0f172a;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 6px;
    }

    .color-indicator {
      width: 20px;
      height: 20px;
      min-width: 20px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    /* PIN Modal */
    .pin-box {
      background: #1e293b;
      width: 90%;
      max-width: 320px;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      border: 1px solid #38bdf8;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      margin: auto;
    }

    .pin-input {
      width: 100%;
      background: #0f172a;
      border: 2px solid #334155;
      padding: 12px;
      border-radius: 8px;
      color: #38bdf8;
      font-size: 1.3rem;
      text-align: center;
      letter-spacing: 6px;
      font-weight: bold;
      outline: none;
      margin: 14px 0;
    }
    .pin-input:focus { border-color: #38bdf8; }

    #printSection { display: none; }

    @media print {
      body * { visibility: hidden; }
      #printSection, #printSection * { visibility: visible; }
      #printSection {
        display: block !important;
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: #fff !important;
        color: #000 !important;
        padding: 15px;
      }
      .print-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
      }
      .print-table th, .print-table td {
        border: 1px solid #444;
        padding: 6px 8px;
        text-align: left;
        font-size: 9.5pt;
        vertical-align: middle;
      }
      .print-table th {
        background-color: #f1f5f9;
        font-weight: bold;
      }
      .print-dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 4px;
        vertical-align: middle;
        border: 1px solid #888;
      }
      .sub-colors-box {
        font-size: 8.5pt;
        line-height: 1.3;
      }
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <datalist id="customersDatalist"></datalist>

  <header>
    <div class="top-bar">
      <h1>🧵 KALE DOKUMA TAKİP</h1>
      <div class="top-actions">
        <button type="button" class="pdf-btn" onclick="generatePdfReport()">🖨️ PDF / Yazdır</button>
        <div class="sync-badge">
          <span class="pulse"></span>
          <span id="syncText">Hazır</span>
        </div>
      </div>
    </div>

    <!-- أزرار الشُعب الـ 4 مع التوزيع الجديد -->
    <div class="branch-bar">
      <button class="branch-btn active" data-branch="all">Tümü (34)</button>
      <button class="branch-btn" data-branch="R">Rüya (16)</button>
      <button class="branch-btn" data-branch="A">Acar (4)</button>
      <button class="branch-btn" data-branch="Y">Y. Acar (8)</button>
      <button class="branch-btn" data-branch="K">Karaman (6)</button>
    </div>

    <div class="stats-row">
      <div class="stat-pill"><div class="num" id="statRunning" style="color:var(--status-running)">0</div><div class="lbl">Çalışıyor</div></div>
      <div class="stat-pill"><div class="num" id="statStopped" style="color:var(--status-stopped)">0</div><div class="lbl">Duruş</div></div>
      <div class="stat-pill"><div class="num" id="statYarn" style="color:var(--status-yarn)">0</div><div class="lbl">İplik Yok</div></div>
      <div class="stat-pill"><div class="num" id="statMaint" style="color:var(--status-maint)">0</div><div class="lbl">Bakımda</div></div>
    </div>

    <div class="controls-row">
      <input type="text" id="searchInput" class="search-input" placeholder="Müşteri veya Makine Ara...">
      <button class="filter-btn active" data-filter="all">Tüm Boylar</button>
      <button class="filter-btn" data-filter="140">140 cm</button>
      <button class="filter-btn" data-filter="160">160 cm</button>
      <button class="filter-btn" data-filter="200">200 cm</button>
    </div>
  </header>

  <main class="grid-container" id="loomsGrid"></main>

  <div id="printSection"></div>

  <!-- PIN Modal -->
  <div class="modal-overlay" id="pinModal" style="align-items:center;">
    <div class="pin-box">
      <h3 style="color:#f8fafc; font-size:1rem; margin-bottom:4px;">🔒 Güvenlik Kilidi</h3>
      <p style="color:#94a3b8; font-size:0.75rem;">Düzenleme yapmak için şifreyi giriniz:</p>
      
      <input type="password" id="pinInput" class="pin-input" maxlength="8" placeholder="••••" inputmode="numeric">
      <div id="pinError" style="color:#ef4444; font-size:0.75rem; display:none; margin-bottom:10px;">Hatalı şifre! Lütfen tekrar deneyin.</div>

      <div style="display:flex; gap:8px;">
        <button type="button" class="modal-btn-cancel" style="flex:1;" onclick="closePinModal()">Vazgeç</button>
        <button type="button" class="modal-btn-save" style="flex:1;" onclick="verifyPin()">Giriş</button>
      </div>
    </div>
  </div>

  <!-- Modal تعديل البطاقات -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-sheet">
      <div class="modal-header-top">
        <button type="button" class="modal-btn-cancel" id="modalCancelBtn">✕ Kapat</button>
        <h2 id="modalLoomTitle" style="font-size: 1rem; color:#38bdf8; margin:0; text-align:center;">Makine Ayarı</h2>
        <button type="button" class="modal-btn-save" id="saveBtn">✓ Kaydet</button>
      </div>

      <div class="form-group">
        <label>Makine Durumu</label>
        <div class="status-selector">
          <button type="button" class="status-opt-btn" data-val="running">Çalışıyor</button>
          <button type="button" class="status-opt-btn" data-val="yarn">İplik Yok</button>
          <button type="button" class="status-opt-btn" data-val="stopped">Durduruldu</button>
          <button type="button" class="status-opt-btn" data-val="maint">Arıza / Bakım</button>
        </div>
      </div>

      <div class="form-group">
        <label>Mevcut Müşteri (Şu Anda Çalışan)</label>
        <input type="text" id="formCurrentCustomer" class="form-input" list="customersDatalist" placeholder="Müşteri adı giriniz...">
      </div>

      <div class="form-group">
        <label>Gelecek Müşteri (Sonraki Planlanan)</label>
        <input type="text" id="formNextCustomer" class="form-input" list="customersDatalist" placeholder="Gelecek müşteri adı giriniz...">
      </div>

      <div class="form-group">
        <label>En (Genişlik)</label>
        <select id="formWidth" class="form-select">
          <option value="140">140 cm</option>
          <option value="160">160 cm</option>
          <option value="200">200 cm (2 Metre)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Ana Renk (Büyük Daire - 1. Renk)</label>
        <div class="color-select-item">
          <span class="color-indicator" id="colDot1" style="width:22px; height:22px;"></span>
          <select id="colSelect1" class="form-select" onchange="updateColDot(1)"></select>
        </div>

        <label style="margin-top:6px;">Alt Renkler (2, 3 ve 4. Renkler)</label>
        <div class="color-select-item">
          <span style="font-weight:bold; color:#94a3b8; font-size:0.75rem;">2:</span>
          <span class="color-indicator" id="colDot2"></span>
          <select id="colSelect2" class="form-select" onchange="updateColDot(2)"></select>
        </div>
        <div class="color-select-item">
          <span style="font-weight:bold; color:#94a3b8; font-size:0.75rem;">3:</span>
          <span class="color-indicator" id="colDot3"></span>
          <select id="colSelect3" class="form-select" onchange="updateColDot(3)"></select>
        </div>
        <div class="color-select-item">
          <span style="font-weight:bold; color:#94a3b8; font-size:0.75rem;">4:</span>
          <span class="color-indicator" id="colDot4"></span>
          <select id="colSelect4" class="form-select" onchange="updateColDot(4)"></select>
        </div>
      </div>

      <div class="form-group">
        <label>Çözgü Renkleri (Siyah, Beyaz, Sarı)</label>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
          <div class="color-select-item">
            <span style="font-weight:bold; color:#94a3b8; font-size:0.75rem;">1:</span>
            <span class="color-indicator" id="warpDot1"></span>
            <select id="warpSelect1" class="form-select" onchange="updateWarpDot(1)"></select>
          </div>
          <div class="color-select-item">
            <span style="font-weight:bold; color:#94a3b8; font-size:0.75rem;">2:</span>
            <span class="color-indicator" id="warpDot2"></span>
            <select id="warpSelect2" class="form-select" onchange="updateWarpDot(2)"></select>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const MASTER_PIN = "1989";
    let isAuthorized = sessionStorage.getItem('kale_auth_ok') === 'true';
    let pendingLoomId = null;

    const PRESET_COLORS = [
      { name: "0", hex: "#475569" },
      { name: "PETROL", hex: "#0ea5e9" },
      { name: "KOYU BORDO", hex: "#4a0404" },
      { name: "LACİVERT", hex: "#1e3a8a" },
      { name: "AÇIK BORDO", hex: "#9f1239" },
      { name: "AÇIK GRİ", hex: "#d1d5db" },
      { name: "PAST GRAY", hex: "#f1f5f9" },
      { name: "SP GREY", hex: "#94a3b8" },
      { name: "KOYU GRİ", hex: "#334155" },
      { name: "SİYAH", hex: "#0f172a" },
      { name: "SİLKY(SARIBEJ)", hex: "#f59e0b" },
      { name: "SARIBEJ", hex: "#d4a373" },
      { name: "ŞEKER LT", hex: "#fef9c3" },
      { name: "IVORY", hex: "#fffff0" },
      { name: "ŞEKER AYM", hex: "#fef3c7" },
      { name: "VİZON", hex: "#b08968" },
      { name: "KOYU KAHVE", hex: "#38220f" },
      { name: "MARON", hex: "#722f37" },
      { name: "ZÜMRÜT", hex: "#0e4d64" },
      { name: "Z-blue", hex: "#0284c7" },
      { name: "FOWN (AÇIK BAL)", hex: "#e6ccb2" },
      { name: "NEFTİ", hex: "#14532d" },
      { name: "FISTIK YEŞİL", hex: "#84cc16" }
    ];

    const WARP_COLORS = [
      { name: "SİYAH", hex: "#0f172a" },
      { name: "BEYAZ", hex: "#ffffff" },
      { name: "SARI", hex: "#eab308" }
    ];

    function getColorHex(name) {
      const match = PRESET_COLORS.find(c => c.name === name);
      return match ? match.hex : "#475569";
    }

    function getWarpColorHex(name) {
      const match = WARP_COLORS.find(c => c.name === name);
      return match ? match.hex : "#0f172a";
    }

    const emptyWarps = [
      { name: "BEYAZ", hex: "#ffffff" },
      { name: "SİYAH", hex: "#0f172a" }
    ];

    const emptyColors = [
      { name: "0", hex: "#475569" },
      { name: "0", hex: "#475569" },
      { name: "0", hex: "#475569" },
      { name: "0", hex: "#475569" }
    ];

    // تقسيم الشُعب مع التقسيم الجديد: Acar (4) و Y. Acar (8)
    function buildEmptyFactory() {
      const map = {};
      const widths = [140, 160, 200];

      // 1. Rüya: R1 -> R16 (16 ماكينة)
      for (let i = 1; i <= 16; i++) {
        const id = `R${i}`;
        map[id] = {
          id: id,
          num: i,
          branch: 'R',
          width: widths[(i - 1) % widths.length],
          status: 'running',
          currentCustomer: '',
          nextCustomer: '',
          warps: JSON.parse(JSON.stringify(emptyWarps)),
          colors: JSON.parse(JSON.stringify(emptyColors))
        };
      }

      // 2. Acar: A1 -> A4 (4 ماكينات)
      for (let i = 1; i <= 4; i++) {
        const id = `A${i}`;
        map[id] = {
          id: id,
          num: i,
          branch: 'A',
          width: widths[(i - 1) % widths.length],
          status: 'running',
          currentCustomer: '',
          nextCustomer: '',
          warps: JSON.parse(JSON.stringify(emptyWarps)),
          colors: JSON.parse(JSON.stringify(emptyColors))
        };
      }

      // 3. Y. Acar: Y1 -> Y8 (8 ماكينات)
      for (let i = 1; i <= 8; i++) {
        const id = `Y${i}`;
        map[id] = {
          id: id,
          num: i,
          branch: 'Y',
          width: widths[(i - 1) % widths.length],
          status: 'running',
          currentCustomer: '',
          nextCustomer: '',
          warps: JSON.parse(JSON.stringify(emptyWarps)),
          colors: JSON.parse(JSON.stringify(emptyColors))
        };
      }

      // 4. Karaman: K1 -> K6 (6 ماكينات)
      for (let i = 1; i <= 6; i++) {
        const id = `K${i}`;
        map[id] = {
          id: id,
          num: i,
          branch: 'K',
          width: widths[(i - 1) % widths.length],
          status: 'running',
          currentCustomer: '',
          nextCustomer: '',
          warps: JSON.parse(JSON.stringify(emptyWarps)),
          colors: JSON.parse(JSON.stringify(emptyColors))
        };
      }
      return map;
    }

    let localCache = localStorage.getItem('kale_dokuma_local_v2');
    let loomsData = localCache ? JSON.parse(localCache) : buildEmptyFactory();
    let customersList = JSON.parse(localStorage.getItem('kale_customers_list_v2') || '[]');

    let selectedLoomId = null;
    let selectedStatus = 'running';
    let currentFilter = 'all';
    let currentBranch = 'all';
    let currentSearch = '';

    populateColorDropdowns();
    renderLooms();
    updateStats();
    updateCustomersDatalist();

    try {
      const firebaseConfig = {
        apiKey: "AIzaSyBWWp1Le6f3y__f7WWoFVvYw9MwdHwFYjc",
        authDomain: "fabrika-e9b49.firebaseapp.com",
        databaseURL: "https://fabrika-e9b49-default-rtdb.firebaseio.com",
        projectId: "fabrika-e9b49",
        storageBucket: "fabrika-e9b49.firebasestorage.app",
        messagingSenderId: "208016312960",
        appId: "1:208016312960:web:db8531b655252e19ecf465"
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      const loomsRef = db.ref('kale_dokuma_live_v2');
      const customersRef = db.ref('kale_customers_pool_v2');

      loomsRef.on('value', (snapshot) => {
        const remoteData = snapshot.val();
        if (remoteData && Object.keys(remoteData).length > 0) {
          loomsData = remoteData;
          localStorage.setItem('kale_dokuma_local_v2', JSON.stringify(loomsData));
          renderLooms();
          updateStats();
          document.getElementById('syncText').innerText = "Canlı Bağlantı";
        } else {
          loomsRef.set(loomsData);
          document.getElementById('syncText').innerText = "Canlı Bağlantı";
        }
      });

      customersRef.on('value', (snapshot) => {
        const list = snapshot.val();
        if (list && Array.isArray(list)) {
          customersList = list;
          localStorage.setItem('kale_customers_list_v2', JSON.stringify(customersList));
          updateCustomersDatalist();
        }
      });

      window.loomsRef = loomsRef;
      window.customersRef = customersRef;
    } catch (e) {
      console.log("Firebase offline mode active:", e);
      document.getElementById('syncText').innerText = "Yerel Mod";
    }

    function populateColorDropdowns() {
      const colSelects = [
        document.getElementById('colSelect1'),
        document.getElementById('colSelect2'),
        document.getElementById('colSelect3'),
        document.getElementById('colSelect4')
      ];

      colSelects.forEach(sel => {
        if (!sel) return;
        sel.innerHTML = '';
        PRESET_COLORS.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.name;
          opt.innerText = c.name === "0" ? "0 (İplik Yok)" : c.name;
          sel.appendChild(opt);
        });
      });

      const warpSelects = [
        document.getElementById('warpSelect1'),
        document.getElementById('warpSelect2')
      ];

      warpSelects.forEach(sel => {
        if (!sel) return;
        sel.innerHTML = '';
        WARP_COLORS.forEach(w => {
          const opt = document.createElement('option');
          opt.value = w.name;
          opt.innerText = w.name;
          sel.appendChild(opt);
        });
      });
    }

    function updateColDot(idx) {
      const sel = document.getElementById(`colSelect${idx}`);
      const dot = document.getElementById(`colDot${idx}`);
      dot.style.backgroundColor = getColorHex(sel.value);
    }

    function updateWarpDot(idx) {
      const sel = document.getElementById(`warpSelect${idx}`);
      const dot = document.getElementById(`warpDot${idx}`);
      dot.style.backgroundColor = getWarpColorHex(sel.value);
    }

    function updateCustomersDatalist() {
      const datalist = document.getElementById('customersDatalist');
      datalist.innerHTML = '';
      customersList.sort().forEach(cust => {
        if (cust && cust.trim() !== '-' && cust.trim() !== '') {
          const opt = document.createElement('option');
          opt.value = cust;
          datalist.appendChild(opt);
        }
      });
    }

    function handleLoomCardClick(loomId) {
      if (isAuthorized) {
        openModal(loomId);
      } else {
        pendingLoomId = loomId;
        document.getElementById('pinInput').value = '';
        document.getElementById('pinError').style.display = 'none';
        document.getElementById('pinModal').classList.add('open');
        setTimeout(() => document.getElementById('pinInput').focus(), 100);
      }
    }

    function closePinModal() {
      document.getElementById('pinModal').classList.remove('open');
      pendingLoomId = null;
    }

    function verifyPin() {
      const entered = document.getElementById('pinInput').value.trim();
      if (entered === MASTER_PIN) {
        isAuthorized = true;
        sessionStorage.setItem('kale_auth_ok', 'true');
        closePinModal();
        if (pendingLoomId) {
          openModal(pendingLoomId);
        }
      } else {
        document.getElementById('pinError').style.display = 'block';
        document.getElementById('pinInput').value = '';
        document.getElementById('pinInput').focus();
      }
    }

    document.getElementById('pinInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') verifyPin();
    });

    function renderLooms() {
      const container = document.getElementById('loomsGrid');
      container.innerHTML = '';

      const branchOrder = { 'R': 1, 'A': 2, 'Y': 3, 'K': 4 };

      const sortedLooms = Object.values(loomsData).sort((a, b) => {
        if (a.branch === b.branch) {
          return (a.num || 0) - (b.num || 0);
        }
        return (branchOrder[a.branch] || 99) - (branchOrder[b.branch] || 99);
      });

      sortedLooms.forEach(loom => {
        if (currentBranch !== 'all' && loom.branch !== currentBranch) return;
        if (currentFilter !== 'all' && loom.width.toString() !== currentFilter) return;

        if (currentSearch) {
          const q = currentSearch.toLowerCase();
          const matchCurr = (loom.currentCustomer || '').toLowerCase().includes(q);
          const matchNext = (loom.nextCustomer || '').toLowerCase().includes(q);
          const matchId = loom.id.toLowerCase().includes(q);
          if (!matchCurr && !matchNext && !matchId) return;
        }

        const colors = loom.colors || emptyColors;
        const mainColor = colors[0] || emptyColors[0];
        const mainColorHex = getColorHex(mainColor.name) || mainColor.hex;

        const card = document.createElement('div');
        card.className = `loom-card`;
        card.onclick = () => handleLoomCardClick(loom.id);

        const warps = loom.warps || emptyWarps;
        const warp1 = warps[0] || emptyWarps[0];
        const warp2 = warps[1] || emptyWarps[1];

        const subColors = [colors[1], colors[2], colors[3]];
        const subColorsHtml = subColors.map(c => {
          const col = c || emptyColors[0];
          return `
            <div class="sub-color-item">
              <span class="sub-color-dot" style="background-color: ${getColorHex(col.name) || col.hex};"></span>
              <span class="sub-color-name">${col.name === "0" ? "0" : col.name}</span>
            </div>
          `;
        }).join('');

        const currentCustDisplay = loom.currentCustomer && loom.currentCustomer.trim() !== '' ? loom.currentCustomer : '-';
        const nextCustDisplay = loom.nextCustomer && loom.nextCustomer.trim() !== '' ? loom.nextCustomer : '-';

        card.innerHTML = `
          <div class="card-color-stripe" style="background-color: ${mainColorHex};"></div>

          <div class="card-body">
            <div class="card-top">
              <span class="loom-title">${loom.id}</span>
              
              <div class="head-badge" title="Müşteri: ${currentCustDisplay}">
                <span class="head-badge-text">${currentCustDisplay}</span>
              </div>

              <span class="width-tag w-${loom.width}">${loom.width} cm</span>
            </div>

            <div class="color-hierarchy-box">
              <div class="main-color-bar">
                <span class="main-color-dot" style="background-color: ${mainColorHex};"></span>
                <div class="main-color-meta">
                  <span class="main-color-lbl">ANA RENK (1)</span>
                  <span class="main-color-name">${mainColor.name === "0" ? "0 (Yok)" : mainColor.name}</span>
                </div>
              </div>
              <div class="sub-colors-grid">
                ${subColorsHtml}
              </div>
            </div>

            <div class="customers-section">
              <div class="cust-row">
                <span class="cust-lbl">ŞU ANKİ:</span>
                <span class="cust-curr">${currentCustDisplay}</span>
              </div>
              <div class="cust-row">
                <span class="cust-lbl">GELECEK:</span>
                <span class="cust-next">${nextCustDisplay}</span>
              </div>
            </div>

            <div class="warp-section">
              <span class="warp-header-title">ÇÖZGÜ</span>
              <div class="warp-items-row">
                <div class="warp-item">
                  <span class="warp-num">1:</span>
                  <span class="warp-dot" style="background-color: ${getWarpColorHex(warp1.name) || warp1.hex};"></span>
                  <span class="warp-text">${warp1.name}</span>
                </div>
                <div class="warp-item">
                  <span class="warp-num">2:</span>
                  <span class="warp-dot" style="background-color: ${getWarpColorHex(warp2.name) || warp2.hex};"></span>
                  <span class="warp-text">${warp2.name}</span>
                </div>
              </div>
            </div>

          </div>
        `;

        container.appendChild(card);
      });
    }

    function updateStats() {
      let r = 0, s = 0, y = 0, m = 0;
      Object.values(loomsData).forEach(l => {
        if (currentBranch !== 'all' && l.branch !== currentBranch) return;
        if (l.status === 'running') r++;
        else if (l.status === 'stopped') s++;
        else if (l.status === 'yarn') y++;
        else if (l.status === 'maint') m++;
      });
      document.getElementById('statRunning').innerText = r;
      document.getElementById('statStopped').innerText = s;
      document.getElementById('statYarn').innerText = y;
      document.getElementById('statMaint').innerText = m;
    }

    function openModal(id) {
      selectedLoomId = id;
      const l = loomsData[id];
      if (!l) return;

      document.getElementById('modalLoomTitle').innerText = `${l.id} Ayarları`;
      document.getElementById('formCurrentCustomer').value = l.currentCustomer || '';
      document.getElementById('formNextCustomer').value = l.nextCustomer || '';
      document.getElementById('formWidth').value = l.width || '140';

      const cols = l.colors || emptyColors;
      for (let i = 1; i <= 4; i++) {
        const cName = cols[i-1]?.name || "0";
        document.getElementById(`colSelect${i}`).value = cName;
        updateColDot(i);
      }

      const warps = l.warps || emptyWarps;
      const w1 = WARP_COLORS.some(w => w.name === warps[0]?.name) ? warps[0].name : "BEYAZ";
      const w2 = WARP_COLORS.some(w => w.name === warps[1]?.name) ? warps[1].name : "SİYAH";
      document.getElementById('warpSelect1').value = w1;
      document.getElementById('warpSelect2').value = w2;
      updateWarpDot(1);
      updateWarpDot(2);

      setStatusSelection(l.status || 'running');
      document.getElementById('editModal').classList.add('open');
    }

    function setStatusSelection(st) {
      selectedStatus = st;
      document.querySelectorAll('.status-opt-btn').forEach(b => {
        b.className = 'status-opt-btn';
        if (b.dataset.val === st) {
          b.classList.add(`sel-${st}`);
        }
      });
    }

    document.querySelectorAll('.status-opt-btn').forEach(b => {
      b.onclick = () => setStatusSelection(b.dataset.val);
    });

    document.getElementById('modalCancelBtn').onclick = () => {
      document.getElementById('editModal').classList.remove('open');
    };

    document.getElementById('saveBtn').onclick = () => {
      if (!selectedLoomId) return;

      const currCust = document.getElementById('formCurrentCustomer').value.trim();
      const nextCust = document.getElementById('formNextCustomer').value.trim();

      let updatedList = false;
      [currCust, nextCust].forEach(name => {
        if (name && name !== '-' && !customersList.includes(name)) {
          customersList.push(name);
          updatedList = true;
        }
      });

      if (updatedList) {
        localStorage.setItem('kale_customers_list_v2', JSON.stringify(customersList));
        updateCustomersDatalist();
        if (window.customersRef) {
          window.customersRef.set(customersList);
        }
      }

      const updatedColors = [];
      for (let i = 1; i <= 4; i++) {
        const cName = document.getElementById(`colSelect${i}`).value;
        updatedColors.push({
          name: cName,
          hex: getColorHex(cName)
        });
      }

      const w1Name = document.getElementById('warpSelect1').value;
      const w2Name = document.getElementById('warpSelect2').value;

      const updatedWarps = [
        { name: w1Name, hex: getWarpColorHex(w1Name) },
        { name: w2Name, hex: getWarpColorHex(w2Name) }
      ];

      const updatedWidth = parseInt(document.getElementById('formWidth').value);

      const updatedData = {
        ...loomsData[selectedLoomId],
        currentCustomer: currCust,
        nextCustomer: nextCust,
        width: updatedWidth,
        status: selectedStatus,
        warps: updatedWarps,
        colors: updatedColors
      };

      loomsData[selectedLoomId] = updatedData;
      localStorage.setItem('kale_dokuma_local_v2', JSON.stringify(loomsData));
      renderLooms();
      updateStats();
      document.getElementById('editModal').classList.remove('open');

      if (window.loomsRef) {
        window.loomsRef.child(selectedLoomId).set(updatedData);
      }
    };

    function generatePdfReport() {
      const now = new Date();
      const dateStr = now.toLocaleDateString('tr-TR') + ' ' + now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
      
      // التسميات الجديدة للشعب
      const branchNames = { 'R': 'Rüya', 'A': 'Acar', 'Y': 'Y. Acar', 'K': 'Karaman' };
      const currentBranchTitle = currentBranch === 'all' ? 'Tüm Fabrika (34 Makine)' : `${branchNames[currentBranch] || currentBranch} Şubesi`;

      const branchOrder = { 'R': 1, 'A': 2, 'Y': 3, 'K': 4 };

      const sortedLooms = Object.values(loomsData).sort((a, b) => {
        if (a.branch === b.branch) return (a.num || 0) - (b.num || 0);
        return (branchOrder[a.branch] || 99) - (branchOrder[b.branch] || 99);
      });

      let rowsHtml = '';
      sortedLooms.forEach(l => {
        if (currentBranch !== 'all' && l.branch !== currentBranch) return;

        const colors = l.colors || emptyColors;
        const mainColor = colors[0] || emptyColors[0];
        const colorHex = getColorHex(mainColor.name) || mainColor.hex;

        const subColors = [colors[1], colors[2], colors[3]];
        const subColorsHtml = subColors.map((sc, idx) => {
          if (!sc || sc.name === "0") return `<div><span style="color:#888;">${idx + 2}: Yok (0)</span></div>`;
          const hex = getColorHex(sc.name) || sc.hex;
          return `
            <div style="margin-bottom:2px;">
              <span class="print-dot" style="background-color: ${hex};"></span>
              <strong>${idx + 2}:</strong> ${sc.name}
            </div>
          `;
        }).join('');

        const warps = l.warps || emptyWarps;
        const w1 = warps[0]?.name || "-";
        const w2 = warps[1]?.name || "-";
        const warpText = `1: ${w1}<br>2: ${w2}`;

        rowsHtml += `
          <tr>
            <td style="font-weight:bold; font-size:11pt; text-align:center;">${l.id}</td>
            <td style="text-align:center;">${branchNames[l.branch] || l.branch}</td>
            <td style="text-align:center;">${l.width} cm</td>
            <td style="font-weight:bold; font-size:10pt;">${l.currentCustomer || '-'}</td>
            <td>
              <span class="print-dot" style="background-color: ${colorHex};"></span>
              <strong>${mainColor.name === "0" ? "0 (Yok)" : mainColor.name}</strong>
            </td>
            <td>
              <div class="sub-colors-box">
                ${subColorsHtml}
              </div>
            </td>
            <td style="font-size:8.5pt; line-height:1.3;">${warpText}</td>
            <td style="color:#444; font-size:9pt;">${l.nextCustomer || '-'}</td>
          </tr>
        `;
      });

      const printContainer = document.getElementById('printSection');
      printContainer.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #000; padding-bottom:8px;">
          <div>
            <h1 style="font-size:15pt; margin:0;">🧵 KALE DOKUMA TAKİP - RAPORU</h1>
            <p style="font-size:9.5pt; margin:4px 0 0 0; color:#444;">Bölüm: <strong>${currentBranchTitle}</strong></p>
          </div>
          <div style="text-align:right; font-size:8.5pt; color:#444;">
            Tarih: ${dateStr}
          </div>
        </div>

        <table class="print-table">
          <thead>
            <tr>
              <th style="width:8%; text-align:center;">Makine</th>
              <th style="width:12%; text-align:center;">Şube</th>
              <th style="width:8%; text-align:center;">En</th>
              <th style="width:18%;">Şu Anki Müşteri</th>
              <th style="width:16%;">Ana Renk (1)</th>
              <th style="width:16%;">Alt Renkler (2, 3, 4)</th>
              <th style="width:10%;">Çözgü</th>
              <th style="width:12%;">Gelecek Müşteri</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml}
          </tbody>
        </table>
      `;

      window.print();
    }

    document.getElementById('searchInput').oninput = (e) => {
      currentSearch = e.target.value;
      renderLooms();
    };

    document.querySelectorAll('.branch-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.branch-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentBranch = btn.dataset.branch;
        renderLooms();
        updateStats();
      };
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderLooms();
      };
    });
  </script>
</body>
</html>
